<!DOCTYPE html>
<html lang="ca" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pràctica 6: Regulació Proporcional-Integral-Derivativa (PID) completa</title>
  
  <!-- Preconnect to Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Premium CSS Print Media Rules for school report lliurament */
    @media print {
      @page {
        size: A4;
        margin: 15mm 15mm 15mm 15mm;
      }
      
      body {
        background-color: white !important;
        color: #0f172a !important; /* slate-900 */
        font-family: 'Inter', -apple-system, sans-serif !important;
        font-size: 11.5pt !important;
        line-height: 1.5 !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      /* Hide interactive simulator, headers, sliders, scales, and buttons when printing */
      .print\:hidden, 
      header, 
      footer, 
      section.lg\:col-span-5, 
      section.lg\:col-span-7, 
      main, 
      button, 
      input[type="file"],
      .no-print {
        display: none !important;
      }

      /* Allow student report section to expand and print in full width */
      section#studentReportSection,
      section {
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
      }

      /* Avoid cards/activities splitting across pages in middle of a paragraph */
      .print-card {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        border: 1px solid #cbd5e1 !important; /* slate-300 */
        padding: 24px !important;
        border-radius: 8px !important;
        margin-bottom: 24px !important;
        background-color: #ffffff !important;
      }

      /* Title styling inside print report */
      h2 {
        font-size: 14pt !important;
        font-weight: 800 !important;
        color: #0f172a !important;
        border-bottom: 2px solid #0f172a !important;
        padding-bottom: 6px !important;
      }

      h3 {
        font-size: 11pt !important;
        font-weight: 700 !important;
        color: #1e293b !important;
        margin-bottom: 8px !important;
      }

      p {
        font-size: 9.5pt !important;
        color: #334155 !important; /* slate-700 */
        line-height: 1.5 !important;
      }

      /* Hide form textareas and display the print-only div with text content */
      textarea {
        display: none !important;
      }

      .print-textarea-fallback {
        display: block !important;
        background-color: #f8fafc !important; /* slate-50 */
        border-left: 4px solid #0d9488 !important; /* teal-600 */
        border-top: 1px solid #cbd5e1 !important;
        border-right: 1px solid #cbd5e1 !important;
        border-bottom: 1px solid #cbd5e1 !important;
        padding: 16px !important;
        border-radius: 0 8px 8px 0 !important;
        font-size: 10pt !important;
        color: #0f172a !important;
        white-space: pre-wrap !important;
        min-height: 100px !important;
        line-height: 1.6 !important;
      }

      /* Sizing images crisp on page */
      img {
        max-width: 100% !important;
        max-height: 240px !important;
        object-fit: contain !important;
        border-radius: 6px !important;
        margin-top: 12px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      /* Page break controls */
      .page-break {
        page-break-before: always !important;
        break-before: page !important;
      }
    }
  </style>

// ALGORISME D'AUTOTUNING PER ASSAIG DE RELÉ (LLAÇ TANCAT)
// ====================================================================
const int PIN_LED = 9;         // Pin del LED d'actuació (Sortida PWM)
const int PIN_LDR = A0;        // Pin del sensor LDR (Lectura analògica)

// Paràmetres de l'assaig d'Åström
const float SETPOINT = 500.0;  // Consigna desitjada de Lux
const float HYSTERESIS = 15.0; // Amplitud de la histèresi h
const float PWM_MAX = 255.0;   // Actuació alta (SORTIDA_MAX)
const float PWM_MIN = 0.0;     // Actuació baixa (SORTIDA_MIN)
const float AMP_D = (PWM_MAX - PWM_MIN) / 2.0; // Amplitud d'oscil·lació del relé (d = 127.5)

// Variables d'estat de l'autotuner
unsigned long darrerCreuament = 0; // Enregistra el temps de l'últim creuament pel SP
float maxValorCicle = -9999.0;     // Màxim assolit dins d'un cicle
float minValorCicle = 9999.0;      // Mínim assolit dins d'un cicle
int ciclesComplets = 0;            // Comptador de cicles completats d'oscil·lació
bool sobreSetpointAnterior = false;

void setup() {
  Serial.begin(115200);
  pinMode(PIN_LED, OUTPUT);
  Serial.println("Iniciant assaig de sintonització automàtica per Relé d'Åström...");
}

void loop() {
  float y = analogRead(PIN_LDR);   // Llegir valor actual del sensor
  unsigned long ara = millis();
  
  // 1. Control per relé ON/OFF amb histèresi h
  float u = 0;
  if (y < (SETPOINT - HYSTERESIS)) {
    u = PWM_MAX;                   // Massa fosc: encesa al màxim
  } else if (y > (SETPOINT + HYSTERESIS)) {
    u = PWM_MIN;                   // Massa clar: apagada total
  } else {
    // Ens trobem dins la banda d'histèresi: mantenim l'estat anterior
  }
  analogWrite(PIN_LED, u);

  // 2. Guardar els pics màxims i mínims de l'oscil·lació
  if (y > maxValorCicle) maxValorCicle = y;
  if (y < minValorCicle) minValorCicle = y;

  // 3. Detecció del creuament del Setpoint per analitzar període
  bool sobreSetpointAra = (y > SETPOINT);
  if (sobreSetpointAra && !sobreSetpointAnterior) {
    // S'ha produït un creuament de pujada pel setpoint
    if (darrerCreuament > 0) {
      unsigned long tempsCicle = ara - darrerCreuament; // Temps d'un cicle complet
      float Pu = tempsCicle / 1000.0;                   // Converteix a segons (Pu)
      float A = (maxValorCicle - minValorCicle) / 2.0;  // Amplitud d'oscil·lació (A)
      
      ciclesComplets++;
      Serial.print("Cicle "); Serial.print(ciclesComplets);
      Serial.print(" completat: Pu = "); Serial.print(Pu); Serial.print("s");
      Serial.print(", Amplitud A = "); Serial.println(A);

      // Després d'assegurar 3 cicles estables, calculem els paràmetres del PID
      if (ciclesComplets >= 4) {
        float Ku = (4.0 * AMP_D) / (3.14159 * A);      // Guany Crític Ku
        
        // Fórmules Ziegler-Nichols (Llaç Tancat)
        float Kp = 0.60 * Ku;
        float Ki = Kp / (0.50 * Pu);
        float Kd = Kp * (0.125 * Pu);
        
        Serial.println("\\n--- SINTONITZACIÓ DE CONSTANTS FINALS ---");
        Serial.print("Guany Crític (Ku): "); Serial.println(Ku);
        Serial.print("Període Crític (Pu): "); Serial.print(Pu); Serial.println(" segons");
        Serial.print(">> Proporcional (Kp): "); Serial.println(Kp);
        Serial.print(">> Integral (Ki): ");     Serial.println(Ki);
        Serial.print(">> Derivatiu (Kd): ");     Serial.println(Kd);
        Serial.println("-----------------------------------------\\n");
      }
    }
    
    // Reiniciem els valors extrems per al següent cicle d'oscil·lació
    darrerCreuament = ara;
    maxValorCicle = -9999.0;
    minValorCicle = 9999.0;
  }
  sobreSetpointAnterior = sobreSetpointAra;
  
  delay(10); // Execució periòdica del llaç tancat de relé
}`},void 0,!1,{fileName:"/app/applet/src/components/GuiaDidactica.tsx",lineNumber:284,columnNumber:13},this)]},void 0,!0,{fileName:"/app/applet/src/components/GuiaDidactica.tsx",lineNumber:279,columnNumber:11},this)]},void 0,!0,{fileName:"/app/applet/src/components/GuiaDidactica.tsx",lineNumber:274,columnNumber:9},this)]},void 0,!0,{fileName:"/app/applet/src/components/GuiaDidactica.tsx",lineNumber:269,columnNumber:7},this)]},void 0,!0,{fileName:"/app/applet/src/components/GuiaDidactica.tsx",lineNumber:5,columnNumber:5},this)}/**
