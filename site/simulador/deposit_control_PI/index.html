<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Dipòsit PI / On-Off / Histeresi - SCADA</title>
  
  <!-- Carreguem Tailwind CSS per a la interfície interactiva de la consola -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Carreguem React i ReactDOM (versió 18) des de CDNJS de forma de producció stabile -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <!-- Carreguem Babel Standalone des de CDNJS de forma de producció estable per compilar JSX en viu -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    /* Estil personalitzat per als sliders verticals en navegadors basats en Webkit/Blink */
    input[type="range"][orient="vertical"] {
      -webkit-appearance: slider-vertical;
      width: 8px;
      height: 140px;
      padding: 0 4px;
    }
    
    /* Animació personalitzada de desplaçament d'aigua per a les canonades i dolls */
    @keyframes dash {
      to {
        stroke-dashoffset: 20;
      }
    }
    .animate-dash {
      animation: dash 1s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Punt d'ancoratge de React -->
  <div id="root"></div>

  <!-- Codi React compilat amb Babel per a l'execució directa -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Paràmetres del sistema (estat editable)
      const [kp, setKp] = useState(200);
      const [ki, setKi] = useState(50);
      const [setpoint, setSetpoint] = useState(20);
      const [areaBase, setAreaBase] = useState(600);
      
      // kAixeta ara representa el percentatge d'obertura de l'aixeta (0% a 100%)
      const [kAixeta, setKAixeta] = useState(50); // Inicialment al 50% d'obertura (equivalent a k_aixeta = 20)
      
      const [sampleTime, setSampleTime] = useState(100); // ms
      const [bombaInercia, setBombaInercia] = useState(10); // Divisor de la inèrcia de la bomba
      const [disturbi, setDisturbi] = useState(0); // Cabal extern de pertorbació

      // Selecció de l'estratègia de control: 'PI', 'ON_OFF' (Tot o Res), 'HYS' (Histeresi)
      const [modeControl, setModeControl] = useState('PI');
      const [histeresiVal, setHisteresiVal] = useState(1.5); // Diferencial de commutació (0.1 a 5.0 cm)

      // Interruptor dinàmic per activar/desactivar la protecció d'Anti-Windup en viu - INICIALMENT FALS (Desactivat)
      const [antiWindupHabilitat, setAntiWindupHabilitat] = useState(false);

      // Alarmes configurables pel dipòsit
      const [alarmHigh, setAlarmHigh] = useState(26); // Alarma de nivell alt (mín 15, màx 30)
      const [alarmLow, setAlarmLow] = useState(4);    // Alarma de nivell baix (mín 0, màx 15)

      // Estat del procés de simulació unificat
      const [simState, setSimState] = useState({
        nivell: 0,
        errorIntegral: 0,
        qi: 0,
        qo: 0,
        tensioBomba: 0,
        temps: 0,
        windupActiu: false,
        errorActual: 0,
        bombaActiva: false // Estat d'encesa per a controls de tipus On-Off / Histeresi
      });

      const { nivell, errorIntegral, qi, qo, tensioBomba, temps, windupActiu, errorActual, bombaActiva } = simState;

      const [isRunning, setIsRunning] = useState(false);
      
      // Historial per gràfics i terminal sèrie
      const [historial, setHistorial] = useState([]);
      const [serialLogs, setSerialLogs] = useState([]);

      // Referències pel bucle de simulació i l'scroll del terminal
      const simInterval = useRef(null);
      const terminalContainerRef = useRef(null);

      // Presets configurats per a l'estratègia PI amb l'aixeta adaptada al rang 0-100% (50% obertura equival al antic coeficient 20, 0% equival a 0)
      const presets = {
        perfecte: { name: "PI Estable (Perfecte)", kp: 250, ki: 15, setpoint: 20, kAixeta: 50, inercia: 10, alH: 26, alL: 4 },
        nomesP: { name: "Només P (Error permanent)", kp: 150, ki: 0, setpoint: 20, kAixeta: 50, inercia: 10, alH: 26, alL: 4 },
        inestable: { name: "Inestable (Massa Ki)", kp: 50, ki: 100, setpoint: 20, kAixeta: 50, inercia: 10, alH: 26, alL: 4 },
        senseSortida: { name: "Aixeta tancada (K = 0)", kp: 100, ki: 10, setpoint: 20, kAixeta: 0, inercia: 10, alH: 26, alL: 4 }
      };

      const aplicarPreset = (p) => {
        setKp(p.kp);
        setKi(p.ki);
        setSetpoint(p.setpoint);
        setKAixeta(p.kAixeta);
        setBombaInercia(p.inercia);
        setAlarmHigh(p.alH);
        setAlarmLow(p.alL);
        
        // Forcem l'estratègia de control a PI perquè són presets de configuració proporcional/integral
        setModeControl("PI");

        setIsRunning(false);
        setSimState({
          nivell: 0,
          errorIntegral: 0,
          qi: 0,
          qo: 0,
          tensioBomba: 0,
          temps: 0,
          windupActiu: false,
          errorActual: 0,
          bombaActiva: false
        });
        setHistorial([]);
        setSerialLogs(["--- Preset aplicat (Control PI actiu) ---", "Premeu PLAY per iniciar la simulació"]);
      };

      // Control manual de canvi d'estratègia amb reset d'estat integral
      const setOptionControl = (mode) => {
        setModeControl(mode);
        setSimState(prev => ({
          ...prev,
          errorIntegral: 0,
          tensioBomba: 0,
          bombaActiva: false
        }));
        setSerialLogs(prev => [...prev, `[SISTEMA] Canvi d'estratègia a: ${mode === 'PI' ? 'Control PI' : mode === 'ON_OFF' ? 'Tot o Res' : 'Histeresi'}`]);
      };

      // Funció que executa un pas (1 dècima de segon / sample_time)
      const executarPasSimulacio = () => {
        setSimState((prev) => {
          const dt = sampleTime / 1000; // 0.1 segons
          const error = setpoint - prev.nivell;
          
          let u = 0;
          let actiuAW = false;
          let nouErrorIntegral = prev.errorIntegral;
          let nouBombaActiva = prev.bombaActiva;

          // APLIQUEM L'ESTRATEGIA DE CONTROL CORRESPONENT
          if (modeControl === 'PI') {
            // 1. CONTROLADOR PI AMB ANTI-WINDUP
            const pTerm = kp * error;
            const iTermPrevia = ki * prev.errorIntegral * dt;
            const uPrevia = pTerm + iTermPrevia;

            // Condicions de saturació del controlador físic (0 a 1500)
            const estaSaturatSota = uPrevia < 0;
            const estaSaturatDalt = uPrevia > 1500;

            const windupSota = estaSaturatSota && error < 0;
            const windupDalt = estaSaturatDalt && error > 0;
            const sotaAW = windupSota || windupDalt;

            actiuAW = antiWindupHabilitat && sotaAW;

            // LÒGICA DE CÀLCUL: Si Ki és 0, no acumulem cap error integral, el forcem a 0!
            if (ki === 0) {
              nouErrorIntegral = 0;
            } else if (!actiuAW) {
              nouErrorIntegral = prev.errorIntegral + error;
            }

            const iTerm = ki * nouErrorIntegral * dt;
            u = pTerm + iTerm;
            nouBombaActiva = u > 0;

          } else if (modeControl === 'ON_OFF') {
            // 2. ESTRATEGIA TOT O RES (ON-OFF SENSE MARGE)
            if (error > 0) {
              u = 1000;
              nouBombaActiva = true;
            } else {
              u = 0;
              nouBombaActiva = false;
            }
            nouErrorIntegral = 0; // No s'utilitza la part integral

          } else if (modeControl === 'HYS') {
            // 3. ESTRATEGIA AMB HISTERESI
            // Límits de commutació
            const limitInferior = setpoint - histeresiVal;
            const limitSuperior = setpoint + histeresiVal;

            if (prev.nivell < limitInferior) {
              u = 1000; // Engeguem bomba al màxim
              nouBombaActiva = true;
            } else if (prev.nivell > limitSuperior) {
              u = 0; // Aturem bomba completament
              nouBombaActiva = false;
            } else {
              // Dins de la banda d'histeresi, es manté l'estat anterior
              nouBombaActiva = prev.bombaActiva;
              u = nouBombaActiva ? 1000 : 0;
            }
            nouErrorIntegral = 0; // No s'utilitza la part integral
          }

          // Inèrcia de la bomba física: l'aigua d'entrada no canvia a l'instant
          const limitU = Math.max(0, u);
          const nouQi = prev.qi + (limitU - prev.qi) / bombaInercia;

          // 2. SIMULACIÓ FÍSICA
          // El percentatge d'obertura kAixeta (0-100) es multiplica per un factor corrector de 0.4 
          // per obtenir el coeficient real d'escapament de l'aigua (mantenint la dinàmica original 0-40)
          const coefAixetaFisic = kAixeta * 0.4;
          const nouQo = coefAixetaFisic * prev.nivell;
          const qNet = nouQi - nouQo + disturbi;
          
          const variacioNivell = dt * qNet / areaBase;
          let nouNivell = prev.nivell + variacioNivell;
          
          // Restriccions físiques
          if (nouNivell > 30) nouNivell = 30;
          if (nouNivell < 0) nouNivell = 0;

          const nouTemps = prev.temps + 1;

          // Determinació d'estat d'alarmes i logs per registrar en el sèrie
          let alarmStr = "";
          if (nouNivell >= alarmHigh) {
            alarmStr = "\t[ALERTA NIVELL ALT]";
          } else if (nouNivell <= alarmLow) {
            alarmStr = "\t[ALERTA NIVELL BAIX]";
          }
          
          // Afegim logs especials d'estat del control
          if (modeControl === 'PI' && actiuAW) {
            alarmStr += "\t[AW-BLOQUEJAT]";
          } else if (modeControl === 'ON_OFF') {
            alarmStr += nouBombaActiva ? "\t[BOMBA-ON]" : "\t[BOMBA-OFF]";
          } else if (modeControl === 'HYS') {
            alarmStr += nouBombaActiva ? "\t[HIST-ON]" : "\t[HIST-OFF]";
          }

          // Guardem l'historial d'aquest pas (amb el percentatge de l'aixeta integrat)
          const nouRegistre = {
            temps: (nouTemps * dt).toFixed(1),
            nivell: parseFloat(nouNivell.toFixed(2)),
            setpoint: setpoint,
            qi: parseFloat(nouQi.toFixed(1)),
            qo: parseFloat(nouQo.toFixed(1)),
            error: parseFloat(error.toFixed(2)),
            alarmHigh: alarmHigh,
            alarmLow: alarmLow,
            aixetaPct: kAixeta // Guardem el valor d'obertura (%) per visualitzar-lo al gràfic temporal
          };

          setHistorial((prevH) => {
            const h = [...prevH, nouRegistre];
            if (h.length > 100) h.shift();
            return h;
          });

          // Afegir log a la consola sèrie
          setSerialLogs((prevL) => {
            const logStr = `${nouRegistre.temps}s\tNivell: ${nouRegistre.nivell.toFixed(2)} cm\tError: ${nouRegistre.error.toFixed(2)}\tQi: ${nouRegistre.qi.toFixed(1)} cm³/s\tQo: ${nouRegistre.qo.toFixed(1)} cm³/s\tAixeta: ${kAixeta}%${alarmStr}`;
            const logs = [...prevL, logStr];
            if (logs.length > 150) logs.shift();
            return logs;
          });

          return {
            nivell: nouNivell,
            errorIntegral: nouErrorIntegral,
            qi: nouQi,
            qo: nouQo,
            tensioBomba: u,
            temps: nouTemps,
            windupActiu: actiuAW,
            errorActual: error,
            bombaActiva: nouBombaActiva
          };
        });
      };

      // Control de reproducció automàtica
      useEffect(() => {
        if (isRunning) {
          simInterval.current = setInterval(() => {
            executarPasSimulacio();
          }, sampleTime);
        } else {
          if (simInterval.current) clearInterval(simInterval.current);
        }
        return () => {
          if (simInterval.current) clearInterval(simInterval.current);
        };
      }, [isRunning, kp, ki, setpoint, kAixeta, areaBase, disturbi, bombaInercia, sampleTime, alarmHigh, alarmLow, antiWindupHabilitat, modeControl, histeresiVal]);

      // Scroll intern suau de la consola
      useEffect(() => {
        if (terminalContainerRef.current) {
          const container = terminalContainerRef.current;
          container.scrollTop = container.scrollHeight;
        }
      }, [serialLogs]);

      const reiniciarSimulacio = () => {
        setIsRunning(false);
        setSimState({
          nivell: 0,
          errorIntegral: 0,
          qi: 0,
          qo: 0,
          tensioBomba: 0,
          temps: 0,
          windupActiu: false,
          errorActual: 0,
          bombaActiva: false
        });
        setHistorial([]);
        setSerialLogs(["--- Simulador Inicialitzat ---", "Configureu paràmetres i premeu PLAY"]);
      };

      // Càlculs dinàmics de l'estat actual de la fórmula (visual)
      const actualError = (setpoint - nivell).toFixed(2);
      const actualPTerm = (kp * (setpoint - nivell)).toFixed(1);
      const actualITerm = (ki * errorIntegral * (sampleTime / 1000)).toFixed(1);
      const actualVariacio = ((sampleTime/1000) * (qi - qo + disturbi) / areaBase).toFixed(4);

      // Càlcul del % de funcionament actiu de la bomba regulada (0-100%)
      const percentBomba = Math.min(100, Math.max(0, Math.round((tensioBomba / 1000) * 100)));

      return (
        <div className="max-w-7xl mx-auto p-4 font-sans">
          
          {/* HEADER PRINCIPAL DE DISSENY ULTRA-COMPACTAT EN UNA SOLA LÍNIA */}
          <header className="mb-4 bg-slate-800/90 rounded-xl p-2.5 border border-slate-700/60 shadow-md flex flex-wrap md:flex-nowrap items-center justify-between gap-3">
            
            {/* Títol / Logo de la Consola SCADA */}
            <div className="flex items-center gap-2 shrink-0">
              <div className="bg-blue-600/20 p-1.5 rounded-lg border border-blue-500/35">
                <svg className="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
              </div>
              <div className="leading-tight">
                <h1 className="text-sm font-black tracking-tight bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
                  SCADA • Dipòsit
                </h1>
                <span className="text-[9px] text-slate-400 block -mt-0.5">Tauler de Control</span>
              </div>
            </div>

            {/* FILA ÚNICA DE CONTROLS COMPACTADA */}
            <div className="flex flex-wrap md:flex-nowrap items-center gap-3 bg-slate-900/40 p-1.5 rounded-lg border border-slate-700/30 grow justify-between md:justify-end">
              
              {/* 1. Selector d'Estratègies */}
              <div className="flex items-center gap-1.5 shrink-0">
                <span className="text-[9.5px] font-black text-slate-400 uppercase tracking-wider">Estratègia:</span>
                <div className="bg-slate-950 p-0.5 rounded border border-slate-800 flex gap-0.5">
                  {['PI', 'ON_OFF', 'HYS'].map(mode => (
                    <button
                      key={mode}
                      onClick={() => setOptionControl(mode)}
                      className={`px-2 py-0.5 rounded text-[9px] font-bold transition-all ${
                        modeControl === mode 
                          ? 'bg-blue-600 text-white shadow shadow-blue-500/20' 
                          : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      {mode === 'PI' ? 'PI' : mode === 'ON_OFF' ? 'On-Off' : 'Histeresi'}
                    </button>
                  ))}
                </div>
              </div>

              {/* Separador vertical de panell */}
              <div className="hidden md:block w-px h-5 bg-slate-800"></div>

              {/* 2. Selector de Presets */}
              <div className="flex items-center gap-1.5 shrink-0">
                <span className="text-[9.5px] font-black text-slate-400 uppercase tracking-wider">Presets PI:</span>
                <div className="flex gap-0.5">
                  {Object.keys(presets).map(key => (
                    <button
                      key={key}
                      onClick={() => aplicarPreset(presets[key])}
                      className="px-1.5 py-0.5 bg-slate-950 hover:bg-slate-700 border border-slate-800 rounded text-[9px] font-bold text-slate-300 transition-colors"
                      title={presets[key].name}
                    >
                      {presets[key].name.split(' (')[0].replace('PI ', '')}
                    </button>
                  ))}
                </div>
              </div>

              {/* Separador vertical de panell */}
              <div className="hidden md:block w-px h-5 bg-slate-800"></div>

              {/* 3. Interruptor Anti-Windup */}
              <div className={`flex items-center gap-2 transition-all shrink-0 ${
                modeControl !== 'PI' ? 'opacity-25 pointer-events-none' : 'opacity-100'
              }`}>
                <div className="text-left leading-none">
                  <span className="text-[9px] font-bold text-slate-300 block">ANTI-WINDUP</span>
                  <span className="text-[8px] text-slate-500 block">Bloqueig Clamping</span>
                </div>
                <button
                  onClick={() => setAntiWindupHabilitat(!antiWindupHabilitat)}
                  className={`w-8 h-4.5 flex items-center rounded-full p-0.5 transition-all duration-300 ${
                    antiWindupHabilitat ? 'bg-emerald-600 justify-end' : 'bg-rose-950 border border-rose-800/40 justify-start'
                  }`}
                  disabled={modeControl !== 'PI'}
                >
                  <span className="bg-white w-3.5 h-3.5 rounded-full shadow transition-transform"></span>
                </button>
                <span className={`text-[9px] font-bold ${antiWindupHabilitat ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {antiWindupHabilitat ? 'ON' : 'OFF'}
                </span>
              </div>

            </div>
          </header>

          {/* GRID CENTRAL PRINCIPAL */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
            
            {/* COLUMNA ESQUERRA: SLIDERS VERTICALS + DIPÒSIT D'AIGUA + BOTONERA + GRÀFIC TEMPORAL INTEGRAT */}
            <div className="lg:col-span-7 bg-slate-800/80 rounded-xl p-4 border border-slate-700/60 shadow-lg flex flex-col justify-between">
              <div>
                <div className="border-b border-slate-700/60 pb-2 mb-4 flex justify-between items-center">
                  <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wider">
                    Estat de la Planta Física i Controladors Verticals
                  </h2>
                  <span className="text-[10px] text-slate-500 font-mono">PLANT_CONTROL_UNIT</span>
                </div>

                {/* SLIDERS VERTICALS AL COSTAT DEL DIPÒSIT */}
                <div className="grid grid-cols-12 gap-3 items-center">
                  
                  {/* PANELL DE CONTROLS LLISCADORS VERTICALS (SP, Kp, Ki, Aix%, Pert, Inè, AL.H, AL.L, HYS) */}
                  <div className="col-span-7 bg-slate-900/50 p-2.5 rounded-xl border border-slate-700/40 flex flex-row justify-around items-stretch h-[240px]">
                    
                    {/* Vertical Slider 1: Setpoint */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-blue-400">SP</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0"
                          max="30"
                          step="1"
                          value={setpoint}
                          onChange={(e) => setSetpoint(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-blue-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-blue-300 bg-blue-950/80 px-1 py-0.5 rounded font-bold">{setpoint}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Consigna</span>
                    </div>

                    {/* Vertical Slider 2: Kp */}
                    <div className={`flex flex-col items-center justify-between h-full group transition-all ${modeControl !== 'PI' ? 'opacity-20' : ''}`}>
                      <span className="text-[10px] font-bold text-amber-400">Kp</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0"
                          max="500"
                          step="10"
                          value={kp}
                          onChange={(e) => setKp(parseInt(e.target.value))}
                          disabled={modeControl !== 'PI'}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-amber-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-amber-300 bg-amber-950/80 px-1 py-0.5 rounded font-bold">{kp}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Proporc.</span>
                    </div>

                    {/* Vertical Slider 3: Ki */}
                    <div className={`flex flex-col items-center justify-between h-full group transition-all ${modeControl !== 'PI' ? 'opacity-20' : ''}`}>
                      <span className="text-[10px] font-bold text-teal-400">Ki</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0"
                          max="200"
                          step="5"
                          value={ki}
                          onChange={(e) => setKi(parseInt(e.target.value))}
                          disabled={modeControl !== 'PI'}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-teal-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-teal-300 bg-teal-950/80 px-1 py-0.5 rounded font-bold">{ki}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Integral</span>
                    </div>

                    {/* Vertical Slider 4: kAixeta (Obertura de 0 a 100%) */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-rose-400">Aix.</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0"
                          max="100"
                          step="1"
                          value={kAixeta}
                          onChange={(e) => setKAixeta(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-rose-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-rose-300 bg-rose-950/80 px-1 py-0.5 rounded font-bold">{kAixeta}%</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Obertura</span>
                    </div>

                    {/* Vertical Slider 5: Pertorbació */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-violet-400">Pert</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="-150"
                          max="150"
                          step="10"
                          value={disturbi}
                          onChange={(e) => setDisturbi(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-violet-500"
                        />
                      </div>
                      <span className={`text-[9px] font-mono px-0.5 py-0.5 rounded font-bold ${disturbi > 0 ? 'bg-indigo-950 text-indigo-300' : 'bg-slate-950 text-slate-400'}`}>{disturbi}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Pluja</span>
                    </div>

                    {/* Vertical Slider 6: Inèrcia Bomba */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-slate-400">Inè.</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="1"
                          max="50"
                          step="1"
                          value={bombaInercia}
                          onChange={(e) => setBombaInercia(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-slate-300"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-slate-300 bg-slate-850 px-1 py-0.5 rounded font-bold">{bombaInercia}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Inèrcia</span>
                    </div>

                    {/* Límits d'Alarmes */}
                    {/* Vertical Slider 7: Alarma Alta (alarmHigh) */}
                    <div className="flex flex-col items-center justify-between h-full group border-l border-red-500/15 pl-1">
                      <span className="text-[10px] font-bold text-red-500">AL.H</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="15"
                          max="30"
                          step="1"
                          value={alarmHigh}
                          onChange={(e) => setAlarmHigh(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-red-600"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-red-400 bg-red-950/80 px-1 py-0.5 rounded font-bold">{alarmHigh}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Alarma Alta</span>
                    </div>

                    {/* Vertical Slider 8: Alarma Baixa (alarmLow) */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-amber-500">AL.L</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0"
                          max="14"
                          step="1"
                          value={alarmLow}
                          onChange={(e) => setAlarmLow(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-amber-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-amber-400 bg-amber-950/80 px-1 py-0.5 rounded font-bold">{alarmLow}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Alarma Baixa</span>
                    </div>

                    {/* VERTICAL SLIDER 9: HISTERESI (Només actiu si mode és Hysteresi) */}
                    <div className={`flex flex-col items-center justify-between h-full group border-l border-indigo-500/20 pl-1 transition-all ${
                      modeControl !== 'Hysteresi' && modeControl !== 'HYS' ? 'opacity-20' : ''
                    }`}>
                      <span className="text-[10px] font-bold text-indigo-400">HYS</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0.1"
                          max="5.0"
                          step="0.1"
                          value={histeresiVal}
                          onChange={(e) => setHisteresiVal(parseFloat(e.target.value))}
                          disabled={modeControl !== 'Hysteresi' && modeControl !== 'HYS'}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-indigo-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-indigo-300 bg-indigo-950 px-1 py-0.5 rounded font-bold">±{histeresiVal}</span>
                      <span className="text-[8px] text-indigo-400 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Diferencial</span>
                    </div>

                  </div>

                  {/* EL DIPÒSIT SVG ANIMAT */}
                  <div className="col-span-5 flex flex-col items-center relative">
                    
                    {/* Indicadors de cabals en viu */}
                    <div className="absolute top-0 right-0 flex flex-col items-end gap-1 text-[10px] font-mono z-20">
                      <div className="bg-slate-900/95 px-1.5 py-0.5 rounded border border-slate-700/60 flex items-center gap-1.5">
                        <span className="w-2 h-2 bg-sky-500 rounded-full animate-pulse"></span>
                        <span>Entrada: <strong className="text-sky-400">{qi.toFixed(1)}</strong></span>
                      </div>
                      <div className="bg-slate-900/95 px-1.5 py-0.5 rounded border border-slate-700/60 flex items-center gap-1.5">
                        <span className="w-2 h-2 bg-rose-500 rounded-full"></span>
                        <span>Sortida: <strong className="text-rose-400">{qo.toFixed(1)}</strong></span>
                      </div>
                      <div className="bg-slate-900/95 px-1.5 py-0.5 rounded border border-slate-700/60 flex items-center gap-1.5">
                        <span>Nivell: <strong className="text-emerald-400">{nivell.toFixed(2)} cm</strong></span>
                      </div>
                    </div>

                    {/* SVG principal del Dipòsit */}
                    <div className="w-full max-w-[240px] h-[240px] mt-2">
                      <svg viewBox="0 0 200 240" className="w-full h-full">
                        
                        {/* INDICADORS LED D'ALARMES */}
                        <g transform="translate(45, 15)">
                          <circle cx="0" cy="0" r="4.5" fill={nivell >= alarmHigh ? "#ef4444" : "#1e293b"} stroke={nivell >= alarmHigh ? "#fca5a5" : "#475569"} strokeWidth="1" className={nivell >= alarmHigh ? "animate-pulse" : ""} />
                          <text x="8" y="2.5" fill={nivell >= alarmHigh ? "#ef4444" : "#64748b"} fontSize="7" fontWeight="bold">ALM ALT</text>
                        </g>

                        <g transform="translate(110, 15)">
                          <circle cx="0" cy="0" r="4.5" fill={nivell <= alarmLow ? "#f59e0b" : "#1e293b"} stroke={nivell <= alarmLow ? "#fef08a" : "#475569"} strokeWidth="1" className={nivell <= alarmLow ? "animate-pulse" : ""} />
                          <text x="8" y="2.5" fill={nivell <= alarmLow ? "#f59e0b" : "#64748b"} fontSize="7" fontWeight="bold">ALM BAIX</text>
                        </g>

                        {/* Bomba motoritzada */}
                        <path d="M 10 32 L 70 32 L 70 47 L 60 47 L 60 40 L 10 40 Z" fill="#475569" />
                        <rect x="5" y="22" width="15" height="25" rx="2" fill="#1e293b" stroke="#64748b" strokeWidth="2" />
                        <text x="12" y="38" fontSize="8" fill="#38bdf8" textAnchor="middle" fontWeight="bold">M</text>

                        {/* Indicador de % de funcionament digital d'entrada, acoblat dinàmicament a la bomba */}
                        <g transform="translate(10, 14)">
                          <rect x="15" y="10" width="34" height="12" rx="2" fill="#0f172a" stroke="#475569" strokeWidth="0.5" />
                          <text x="32" y="19" fontSize="7.5" fill="#a855f7" fontWeight="bold" textAnchor="middle" fontFamily="monospace">
                            {percentBomba}%
                          </text>
                        </g>

                        {/* Doll d'aigua d'entrada */}
                        {qi > 0.5 && (
                          <path 
                            d={`M 65 47 Q 65 ${80 + (30 - nivell) * 2} ${65 + Math.min(qi/10, 15)} ${220 - (nivell / 30 * 160)}`}
                            fill="none" 
                            stroke="#38bdf8" 
                            strokeWidth={Math.min(2 + qi/40, 7)} 
                            strokeDasharray="4 2"
                            className="animate-dash"
                            style={{ strokeDashoffset: -temps * 5 }}
                          />
                        )}

                        {/* Tub d'escapament de l'aixeta */}
                        <path d="M 170 210 L 200 210 L 200 220 L 170 220 Z" fill="#475569" />
                        <circle cx="185" cy="215" r="7" fill="#dc2626" />
                        <line x1="185" y1="205" x2="185" y2="225" stroke="#fca5a5" strokeWidth="2" />

                        {/* Indicador de % d'obertura digital de l'aixeta, desplaçat a la dreta sobre l'aixeta de sortida */}
                        <g transform="translate(165, 195)">
                          <rect x="0" y="0" width="34" height="12" rx="2" fill="#0f172a" stroke="#475569" strokeWidth="0.5" />
                          <text x="17" y="9" fontSize="7.5" fill="#f43f5e" fontWeight="bold" textAnchor="middle" fontFamily="monospace">
                            {kAixeta}%
                          </text>
                        </g>

                        {/* Doll de sortida de l'aixeta */}
                        {qo > 0.5 && kAixeta > 0 && (
                          <path 
                            d={`M 195 215 Q 220 220 225 240`} 
                            fill="none" 
                            stroke="#0284c7" 
                            strokeWidth={Math.min(1 + qo/40, 6)} 
                            strokeDasharray="3 2"
                            className="animate-dash"
                            style={{ strokeDashoffset: temps * 4 }}
                          />
                        )}

                        {/* Cos del Dipòsit */}
                        <rect x="40" y="50" width="130" height="170" fill="none" stroke="#94a3b8" strokeWidth="4" rx="2" />
                        <line x1="35" y1="60" x2="175" y2="60" stroke="#b91c1c" strokeWidth="1" strokeDasharray="2 2" opacity="0.6" />
                        
                        {/* Línies de l'Histeresi dinàmiques (Només si mode és Histeresi) */}
                        {(modeControl === 'Histeresi' || modeControl === 'HYS') && (
                          <g>
                            <line 
                              x1="40" 
                              y1={220 - ((setpoint + histeresiVal) / 30 * 160)} 
                              x2="170" 
                              y2={220 - ((setpoint + histeresiVal) / 30 * 160)} 
                              stroke="#818cf8" 
                              strokeWidth="1" 
                              strokeDasharray="3 3" 
                            />
                            <line 
                              x1="40" 
                              y1={220 - ((setpoint - histeresiVal) / 30 * 160)} 
                              x2="170" 
                              y2={220 - ((setpoint - histeresiVal) / 30 * 160)} 
                              stroke="#818cf8" 
                              strokeWidth="1" 
                              strokeDasharray="3 3" 
                            />
                            <rect
                              x="42"
                              y={220 - ((setpoint + histeresiVal) / 30 * 160)}
                              width="126"
                              height={(histeresiVal * 2 / 30 * 160)}
                              fill="#818cf8"
                              fillOpacity="0.08"
                            />
                          </g>
                        )}

                        {/* Límits d'Alarma Dinàmics */}
                        {(() => {
                          const yAlarmHigh = 220 - (alarmHigh / 30 * 160);
                          return (
                            <g>
                              <line x1="38" y1={yAlarmHigh} x2="172" y2={yAlarmHigh} stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4 3" opacity="0.9" />
                              <text x="165" y={yAlarmHigh - 3} fill="#f87171" fontSize="7" textAnchor="end" fontWeight="bold">LIM NIVELL ALT: {alarmHigh}cm</text>
                            </g>
                          );
                        })()}

                        {(() => {
                          const yAlarmLow = 220 - (alarmLow / 30 * 160);
                          return (
                            <g>
                              <line x1="38" y1={yAlarmLow} x2="172" y2={yAlarmLow} stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="4 3" opacity="0.9" />
                              <text x="165" y={yAlarmLow + 8} fill="#fbbf24" fontSize="7" textAnchor="end" fontWeight="bold">LIM NIVELL BAIX: {alarmLow}cm</text>
                            </g>
                          );
                        })()}

                        {/* Setpoint (Consigna) */}
                        {(() => {
                          const ySetpoint = 220 - (setpoint / 30 * 160);
                          return (
                            <g>
                              <line x1="38" y1={ySetpoint} x2="172" y2={ySetpoint} stroke="#3b82f6" strokeWidth="2" strokeDasharray="5 3" />
                              <text x="45" y={ySetpoint - 4} fill="#60a5fa" fontSize="9" fontWeight="bold">Consigna: {setpoint}cm</text>
                            </g>
                          );
                        })()}

                        {/* Massa d'aigua */}
                        {nivell > 0 && (
                          <rect 
                            x="42" 
                            y={220 - (nivell / 30 * 160)} 
                            width="126" 
                            height={(nivell / 30 * 160)} 
                            fill="#38bdf8" 
                            fillOpacity="0.45" 
                            rx="1"
                          />
                        )}

                        {/* Regle de mesura */}
                        {[0, 10, 20, 30].map((val) => {
                          const yPos = 220 - (val / 30 * 160);
                          return (
                            <g key={val}>
                              <line x1="170" y1={yPos} x2="175" y2={yPos} stroke="#94a3b8" strokeWidth="1.5" />
                              <text x="181" y={yPos + 3} fill="#94a3b8" fontSize="8" fontFamily="monospace">{val}cm</text>
                            </g>
                          );
                        })}

                        {/* Indicador numèric */}
                        <g transform={`translate(100, ${220 - (nivell / 30 * 160) + 12})`}>
                          {nivell > 2 && (
                            <rect x="-30" y="-10" width="60" height="14" rx="3" fill="#0f172a" fillOpacity="0.8" />
                          )}
                          {nivell > 2 && (
                            <text x="0" y="0" fill="#38bdf8" fontSize="9" fontWeight="bold" textAnchor="middle" fontFamily="monospace">
                              {nivell.toFixed(1)} cm
                            </text>
                          )}
                        </g>

                      </svg>
                    </div>
                  </div>

                </div>
              </div>

              {/* BOTONERA D'ACCIONS DE SIMULACIÓ (Situada just a sota de la planta) */}
              <div className="mt-3 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/30 flex justify-center items-center gap-3">
                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mr-auto pl-2">Accions del procés:</span>
                <button
                  onClick={() => setIsRunning(!isRunning)}
                  className={`px-4 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition-all shadow-md ${
                    isRunning 
                      ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-amber-900/20' 
                      : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'
                  }`}
                >
                  {isRunning ? (
                    <>
                      <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                      Pausa
                    </>
                  ) : (
                    <>
                      <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                      Iniciar (Play)
                    </>
                  )}
                </button>
                <button
                  onClick={() => { executarPasSimulacio(); setIsRunning(false); }}
                  className="px-3 py-1.5 bg-slate-800 hover:bg-slate-750 text-slate-200 rounded-lg text-xs font-semibold transition-colors border border-slate-700"
                  title="Avança només 100 ms"
                >
                  Pas a Pas
                </button>
                <button
                  onClick={reiniciarSimulacio}
                  className="px-3 py-1.5 bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 rounded-lg text-xs font-semibold transition-colors border border-rose-500/20"
                >
                  Reset
                </button>
              </div>

              {/* GRÀFIC TEMPORAL DE NIVELL I LLINDARS D'ALARMA */}
              <div className="mt-4 pt-4 border-t border-slate-700/60 flex flex-col h-[200px]">
                <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                  Gràfic Temporal de Nivell i Llindars d'Alarma
                </h3>
                <div className="relative flex-grow bg-slate-950 rounded-lg p-2 border border-slate-700/70 overflow-hidden flex items-end">
                  
                  {/* Línia de l'Alarma de Nivell Alt */}
                  <div 
                    className="absolute left-0 right-0 border-t border-red-500/45 border-dotted z-0 flex items-center pl-2"
                    style={{ bottom: `${(alarmHigh / 30) * 100}%` }}
                  >
                    <span className="text-[8px] text-red-400 font-bold bg-slate-950 px-1 rounded -mt-2">
                      Alarma Alta: {alarmHigh} cm
                    </span>
                  </div>

                  {/* Línia del Setpoint */}
                  <div 
                    className="absolute left-0 right-0 border-t border-blue-500/50 border-dashed z-0 flex items-center pl-2"
                    style={{ bottom: `${(setpoint / 30) * 100}%` }}
                  >
                    <span className="text-[9px] text-blue-400 font-bold bg-slate-950 px-1 rounded -mt-2.5">
                      Ref: {setpoint} cm
                    </span>
                  </div>

                  {/* Línia de l'Alarma de Nivell Baix */}
                  <div 
                    className="absolute left-0 right-0 border-t border-amber-500/40 border-dotted z-0 flex items-center pl-2"
                    style={{ bottom: `${(alarmLow / 30) * 100}%` }}
                  >
                    <span className="text-[8px] text-amber-400 font-bold bg-slate-950 px-1 rounded -mt-2">
                      Alarma Baixa: {alarmLow} cm
                    </span>
                  </div>

                  {/* Línies d'historial */}
                  <div className="w-full h-full flex items-end justify-between gap-[1px] relative z-10">
                    {historial.map((pt, idx) => {
                      const hPercent = (pt.nivell / 30) * 100;
                      const setPointPercent = (pt.setpoint / 30) * 100;
                      
                      // Càlcul del % d'error respecte al setpoint
                      const errorPct = pt.setpoint > 0 ? Math.abs(pt.nivell - pt.setpoint) / pt.setpoint : (pt.nivell === 0 ? 0 : 999);
                      const propDelSetpoint = errorPct <= 0.10; // Nivell prop del SP més o menys un 10%

                      // Color dinàmic si està en alarma o prop del setpoint (verd)
                      let barColor = "bg-sky-500/70 hover:bg-sky-400";
                      if (pt.nivell >= pt.alarmHigh) {
                        barColor = "bg-red-600/85 hover:bg-red-500";
                      } else if (pt.nivell <= pt.alarmLow) {
                        barColor = "bg-amber-500/85 hover:bg-amber-400";
                      } else if (propDelSetpoint) {
                        barColor = "bg-emerald-500/80 hover:bg-emerald-400"; // Canvia a verd prop de consigna
                      }

                      return (
                        <div key={idx} className="flex-grow h-full relative group">
                          <div 
                            className={`absolute bottom-0 left-0 right-0 rounded-t-sm transition-all ${barColor}`}
                            style={{ height: `${hPercent}%` }}
                          ></div>
                          <div 
                            className="absolute w-1 h-1 bg-blue-400 rounded-full left-1/2 -translate-x-1/2 -translate-y-1/2"
                            style={{ bottom: `${setPointPercent}%` }}
                          ></div>

                          {/* Tooltip actualitzat amb el percentatge d'obertura actiu */}
                          <div className="absolute bottom-full left-1/2 -translate-x-1/2 bg-slate-900 text-slate-200 text-[10px] px-2 py-1 rounded border border-slate-700 opacity-0 group-hover:opacity-100 transition-opacity z-50 pointer-events-none whitespace-nowrap mb-1">
                            T: {pt.temps}s • {pt.nivell}cm <br />
                            SP: {pt.setpoint}cm <br />
                            Aixeta: {pt.aixetaPct}% <br />
                            {pt.nivell >= pt.alarmHigh && "⚠️ ALTA"}
                            {pt.nivell <= pt.alarmLow && "⚠️ BAIXA"}
                            {!pt.alarmHigh && !pt.alarmLow && propDelSetpoint && "🎯 ESTABLE (±10%)"}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {historial.length === 0 && (
                    <div className="absolute inset-0 flex items-center justify-center text-slate-500 text-xs text-center p-4">
                      Els gràfics es dibuixen en iniciar la simulació.
                    </div>
                  )}
                </div>
                
                <div className="flex justify-between items-center text-[9px] text-slate-400 mt-2">
                  <div className="flex flex-wrap gap-x-2 gap-y-1">
                    <span className="flex items-center gap-1">
                      <span className="w-2 h-2 bg-sky-500 rounded-full inline-block"></span> Estàndard
                    </span>
                    <span className="flex items-center gap-1">
                      <span className="w-2 h-2 bg-emerald-500 rounded-full inline-block"></span> Prop del SP (±10%)
                    </span>
                    <span className="flex items-center gap-1">
                      <span className="w-2 h-2 bg-red-500 rounded-full inline-block"></span> Alarma Alta
                    </span>
                    <span className="flex items-center gap-1">
                      <span className="w-2 h-2 bg-amber-500 rounded-full inline-block"></span> Alarma Baixa
                    </span>
                  </div>
                  <span>Visualització de 10 segons</span>
                </div>
              </div>

            </div>

            {/* COLUMNA DRETA: EL PANELL COMPLET DE CÀLCULS EN TEMPS REAL DINÀMIC (Col: 5) */}
            <div className="lg:col-span-5 bg-slate-800/80 rounded-xl p-4 border border-slate-700/60 shadow-lg flex flex-col justify-between">
              <div>
                <div className="border-b border-slate-700/60 pb-2 mb-3 flex items-center gap-2">
                  <span className="w-2.5 h-2.5 bg-amber-500 rounded-full animate-pulse"></span>
                  <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wider">
                    Càlculs Interns ({modeControl === 'PI' ? 'Mode PI' : modeControl === 'ON_OFF' ? 'Mode Tot o Res' : 'Mode Histeresi'})
                  </h2>
                </div>
                
                {/* CÀLCULS ADAPTATIUS SEGONS L'ESTRATÈGIA ACTIVA */}
                <div className="space-y-3 text-xs font-mono">
                  
                  {/* PAS 1: ERROR / LLINDARS AMB PRESENTACIÓ DE FÓRMULA */}
                  <div className="bg-slate-900/60 p-2.5 rounded border border-slate-755">
                    <span className="text-slate-400 font-bold text-[10px] block uppercase tracking-wide">1. Error i Referència (Fórmula: e = SP - Nivell)</span>
                    <div className="text-blue-400 text-sm mt-1 font-bold">
                      e = {setpoint} - {nivell.toFixed(2)} = <span className="text-emerald-400">{actualError} cm</span>
                    </div>
                    {(modeControl === 'Hysteresi' || modeControl === 'HYS') && (
                      <div className="text-[10px] text-indigo-400 mt-1">
                        Banda d'Histeresi (±{histeresiVal}cm): Marges { (setpoint - histeresiVal).toFixed(1) } cm a { (setpoint + histeresiVal).toFixed(1) } cm
                      </div>
                    )}
                  </div>

                  {/* PAS 2: INTEGRAL (PI) O CONDICIÓ D'ESTAT (ON-OFF / HISTERESI) AMB PRESENTACIÓ DE FÓRMULA */}
                  {modeControl === 'PI' ? (
                    <div className="bg-slate-900/60 p-2.5 rounded border border-slate-755">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-slate-400 font-bold text-[10px] block uppercase tracking-wide">
                          2. Part Integral (Fórmula: e_int = e_int_ant + e)
                        </span>
                        <span className={`text-[9px] px-1.5 py-0.5 rounded border font-sans font-bold ${
                          ki === 0
                            ? 'bg-slate-800 text-slate-400 border-slate-700'
                            : !antiWindupHabilitat 
                              ? 'bg-slate-800 text-slate-400 border-slate-700' 
                              : windupActiu 
                                ? 'bg-red-500/10 text-red-400 border-red-500/25 animate-pulse' 
                                : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/25'
                        }`}>
                          {ki === 0 ? 'Ki deshabilitada' : !antiWindupHabilitat ? 'Anti-Windup: OFF' : windupActiu ? '⚠️ AW Actiu (Bloquejat)' : 'AW OK (Integrant)'}
                        </span>
                      </div>
                      
                      <div className="text-teal-400 text-xs font-bold mt-1.5 space-y-1">
                        <div>
                          Suma acumulada (e_integral) = <span className="text-teal-300">{errorIntegral.toFixed(1)}</span>
                        </div>
                        
                        {/* Fórmula dinàmica pas a pas de la integració condicional */}
                        <div className="text-[11px] text-slate-300 font-normal border-t border-slate-700/40 pt-1 mt-1">
                          {ki === 0 ? (
                            <span className="text-slate-400">
                              Lògica: Ki = 0 (Només P) &rarr; error_integral = <span className="font-bold underline">0</span> (Sense integració)
                            </span>
                          ) : windupActiu ? (
                            <span className="text-red-400">
                              Lògica: Clamping actiu &rarr; {errorIntegral.toFixed(1)} + <span className="underline font-bold">0</span> = <span className="font-bold">{errorIntegral.toFixed(1)}</span>
                            </span>
                          ) : (
                            <span className="text-slate-200">
                              Lògica: {errorIntegral.toFixed(1)} + ({actualError}) = <span className="font-bold">{(errorIntegral + parseFloat(actualError)).toFixed(1)}</span>
                            </span>
                          )}
                        </div>
                      </div>

                      {/* Explicació dinàmica de seguretat */}
                      <div className="text-[10px] text-slate-400 mt-2 font-sans italic leading-normal">
                        {ki === 0 ? (
                          <span>• Mode Proporcional pur (P): Com que la constant Ki està a zero, no hi ha acumulació d'error del passat i l'error integral roman clamat a 0.</span>
                        ) : windupActiu ? (
                          <span className="text-red-400 font-semibold block">
                            • Anti-Windup en Clamping: Bloquejat per evitar l'acumulació innecessària d'error de saturació mentre la bomba física està clavada a 0.
                          </span>
                        ) : !antiWindupHabilitat && (nivell > setpoint) && (qi <= 0.01) ? (
                          <span className="text-rose-400 font-semibold block">
                            • Alerta de Saturació (Windup): L'Anti-Windup està apagat. L'error s'acumula negativament sense límit i farà que la bomba tardi a respondre en demanar aigua!
                          </span>
                        ) : (
                          <span>• Integració activa: El controlador està operant dins de la finestra física de treball.</span>
                        )}
                      </div>
                    </div>
                  ) : modeControl === 'ON_OFF' ? (
                    <div className="bg-slate-900/60 p-2.5 rounded border border-slate-755">
                      <span className="text-slate-400 font-bold text-[10px] block uppercase tracking-wide">2. Condició d'Estat (Tot o Res)</span>
                      <div className="text-sm mt-1 font-bold">
                        Nivell ({nivell.toFixed(2)} cm) &lt; Setpoint ({setpoint} cm)?{' '}
                        {errorActual > 0 ? (
                          <span className="text-emerald-400">SÍ (Demanda d'aigua)</span>
                        ) : (
                          <span className="text-rose-400">NO (Dipòsit ple)</span>
                        )}
                      </div>
                      <p className="text-[10px] text-slate-400 mt-1 font-sans italic leading-tight">
                        El sistema commuta de forma immediata i directa al revés de l'error sense cap filtre ni marge.
                      </p>
                    </div>
                  ) : (
                    <div className="bg-slate-900/60 p-2.5 rounded border border-slate-755">
                      <span className="text-slate-400 font-bold text-[10px] block uppercase tracking-wide">2. Banda i Lògica de Commutació (Histeresi)</span>
                      <div className="text-[11px] mt-1.5 space-y-1">
                        <div className="flex justify-between">
                          <span>Estat de la Bomba:</span>
                          <span className={`font-bold ${bombaActiva ? 'text-emerald-400' : 'text-slate-400'}`}>
                            {bombaActiva ? 'ON (Funcionant)' : 'OFF (Aturada)'}
                          </span>
                        </div>
                        <div className="border-t border-slate-700/40 pt-1 mt-1">
                          {nivell < (setpoint - histeresiVal) ? (
                            <span className="text-emerald-400 font-bold">• Nivell sota llindar ({ (setpoint - histeresiVal).toFixed(1) }cm) -> Bomba s'encén.</span>
                          ) : nivell > (setpoint + histeresiVal) ? (
                            <span className="text-rose-400 font-bold">• Nivell sobre llindar ({ (setpoint + histeresiVal).toFixed(1) }cm) -> Bomba s'atura.</span>
                          ) : (
                            <span className="text-indigo-300">• Dins de la banda ({ (setpoint - histeresiVal).toFixed(1) } a { (setpoint + histeresiVal).toFixed(1) }cm) -> Manté estat.</span>
                          )}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* PAS 3: LLEI DE CONTROL (u) */}
                  <div className="bg-slate-900/60 p-2.5 rounded border border-slate-755">
                    <span className="text-slate-400 font-bold text-[10px] block uppercase tracking-wide">3. Equació i Senyal del Controlador (u)</span>
                    {modeControl === 'PI' ? (
                      <div className="text-slate-200 text-[11px] mt-1 leading-relaxed whitespace-pre-line">
                        u = (Kp · e) + (Ki · e_integral · dt) <br />
                        u = (<span className="text-amber-400">{kp}</span> · <span className="text-emerald-400">{actualError}</span>) + (<span className="text-teal-400">{ki}</span> · <span className="text-teal-300">{errorIntegral.toFixed(1)}</span> · 0.1) <br />
                        u = <span className="text-amber-300">{actualPTerm}</span> + <span className="text-teal-300">{actualITerm}</span> = <span className="text-purple-400 font-bold text-sm">{tensioBomba.toFixed(1)}</span>
                      </div>
                    ) : modeControl === 'ON_OFF' ? (
                      <div className="text-slate-200 text-[11px] mt-1 leading-relaxed">
                        u = (Error &gt; 0) ? 1000 : 0 <br />
                        u = ({actualError} &gt; 0) ? <span className="text-purple-400 font-bold">{tensioBomba} (100% de potència)</span> : <span className="text-slate-400 font-bold">0 (Bomba OFF)</span>
                      </div>
                    ) : (
                      <div className="text-slate-200 text-[11px] mt-1 leading-relaxed">
                        u = (Bomba Activa)? 1000 : 0 <br />
                        Bomba actual: <span className={bombaActiva ? 'text-emerald-400 font-bold' : 'text-slate-400 font-bold'}>{bombaActiva ? 'ACTIVA' : 'INACTIVA'}</span> -> u = <span className="text-purple-400 font-bold text-sm">{tensioBomba}</span>
                      </div>
                    )}
                  </div>

                  {/* PAS 4: FÍSICA (Actualitzat per reflectir la nova obertura de l'aixeta de 0-100% factor de 0.4) */}
                  <div className="bg-slate-900/60 p-2.5 rounded border border-slate-755">
                    <span className="text-slate-400 font-bold text-[10px] block uppercase tracking-wide">4. Física del dipòsit (q_net / Area)</span>
                    <div className="text-slate-200 text-[11px] mt-1 leading-relaxed">
                      qo = (Aixeta% · 0.4) · Nivell = ({kAixeta}% · 0.4) · {nivell.toFixed(2)} = <span className="text-rose-400 font-bold">{qo.toFixed(1)} cm³/s</span> <br />
                      ΔNivell = dt · (qi - qo + pertorbació) / Àrea <br />
                      ΔNivell = 0.1 · ({qi.toFixed(1)} - {qo.toFixed(1)} + {disturbi}) / {areaBase} <br />
                      ΔNivell = <span className="text-amber-500 font-bold">{actualVariacio > 0 ? `+${actualVariacio}` : actualVariacio} cm/pas</span>
                    </div>
                  </div>

                </div>
              </div>

              <div className="mt-3 text-[10px] text-slate-400 bg-slate-900/35 p-2 rounded border border-slate-700/20">
                <span className="font-bold text-blue-400">Comparativa:</span> Prova d'utilitzar el mode <span className="text-emerald-400">Tot o Res</span> per veure chattering frenètic, i després canvia a <span className="text-indigo-400">Histeresi</span> per reduir les commutacions.
              </div>
            </div>

          </div>

          {/* COMPARTIMENT INFERIOR: CONSOLA TERMINAL ARDUINO (Panoràmica a toda l'amplada) */}
          <div className="grid grid-cols-1 gap-4 mt-4">
            <div className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60 shadow-md flex flex-col h-[240px]">
              <div className="flex justify-between items-center border-b border-slate-700/80 pb-2 mb-2">
                <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                  <span className="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
                  Consola Monitor Sèrie (9600 bps)
                </h3>
                <button 
                  onClick={() => setSerialLogs(["--- Consola Netejada ---"])}
                  className="text-[10px] text-slate-400 hover:text-slate-200 bg-slate-900 px-2 py-0.5 rounded border border-slate-700"
                >
                  Esborrar
                </button>
              </div>

              <div 
                ref={terminalContainerRef}
                className="flex-grow bg-slate-950 rounded-lg p-2.5 font-mono text-emerald-400 overflow-y-auto space-y-1 border border-slate-900 h-0"
              >
                {serialLogs.map((log, i) => (
                  <div key={i} className="whitespace-pre-wrap leading-tight text-[11px] opacity-90 border-b border-slate-900/30 pb-0.5">
                    {log}
                  </div>
                ))}
              </div>
            </div>
          </div>

        </div>
      );
    }

    // Renderitzem l'aplicació dins del root principal de la web
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
