<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Dipòsit PI - SCADA</title>
  
  <!-- Carreguem Tailwind CSS per a la interfície interactiva de la consola -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Carreguem React i ReactDOM (versió 18) des de CDNJS de forma estable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <!-- Carreguem Babel Standalone des de CDNJS de forma estable per compilar JSX en viu -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    /* Estil personalitzat per als sliders verticals en navegadors basats en Webkit/Blink */
    input[type="range"][orient="vertical"] {
      -webkit-appearance: slider-vertical;
      width: 8px;
      height: 140px;
      padding: 0 5px;
    }
    
    /* Animació personalitzada de desplaçament d'aigua per a les canonades i dolls */
    @keyframes dash {
      to {
        stroke-dashoffset: 20;
      }
    }
    .animate-dash {
      animation: dash 1s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- Punt d'ancoratge de React -->
  <div id="root"></div>

  <!-- Codi React compilat amb Babel per a l'execució directa -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Paràmetres del sistema (estat editable)
      const [kp, setKp] = useState(200);
      const [ki, setKi] = useState(50);
      const [setpoint, setSetpoint] = useState(20);
      const [areaBase, setAreaBase] = useState(600);
      const [kAixeta, setKAixeta] = useState(20); 
      const [sampleTime, setSampleTime] = useState(100); // ms
      const [bombaInercia, setBombaInercia] = useState(10); // Divisor de la inèrcia de la bomba
      const [disturbi, setDisturbi] = useState(0); // Cabal extern de pertorbació

      // Interruptor dinàmic per activar/desactivar la protecció d'Anti-Windup en viu
      const [antiWindupHabilitat, setAntiWindupHabilitat] = useState(true);

      // Alarmes configurables pel dipòsit
      const [alarmHigh, setAlarmHigh] = useState(26); // Alarma de nivell alt (mín 15, màx 30)
      const [alarmLow, setAlarmLow] = useState(4);    // Alarma de nivell baix (mín 0, màx 15)

      // Estat del procés de simulació unificat amb suport per a estat de l'Anti-Windup
      const [simState, setSimState] = useState({
        nivell: 0,
        errorIntegral: 0,
        qi: 0,
        qo: 0,
        tensioBomba: 0,
        temps: 0,
        windupActiu: false,
        errorActual: 0
      });

      const { nivell, errorIntegral, qi, qo, tensioBomba, temps, windupActiu, errorActual } = simState;

      const [isRunning, setIsRunning] = useState(false);
      
      // Historial per gràfics i terminal sèrie
      const [historial, setHistorial] = useState([]);
      const [serialLogs, setSerialLogs] = useState([]);

      // Referències pel bucle de simulació i l'scroll del terminal
      const simInterval = useRef(null);
      const terminalContainerRef = useRef(null);

      // Presets configurats per ajudar a la comprensió
      const presets = {
        perfecte: { name: "PI Estable (Perfecte)", kp: 150, ki: 40, setpoint: 20, kAixeta: 20, inercia: 10, alH: 26, alL: 4 },
        proporcional: { name: "Només P (Error permanent)", kp: 150, ki: 0, setpoint: 20, kAixeta: 20, inercia: 10, alH: 26, alL: 4 },
        oscilatori: { name: "Inestable (Massa Ki)", kp: 350, ki: 120, setpoint: 20, kAixeta: 20, inercia: 10, alH: 26, alL: 4 },
        senseSortida: { name: "Aixeta tancada (K = 0)", kp: 100, ki: 10, setpoint: 20, kAixeta: 0, inercia: 10, alH: 26, alL: 4 }
      };

      const aplicarPreset = (p) => {
        setKp(p.kp);
        setKi(p.ki);
        setSetpoint(p.setpoint);
        setKAixeta(p.kAixeta);
        setBombaInercia(p.inercia);
        setAlarmHigh(p.alH);
        setAlarmLow(p.alL);
        setIsRunning(false);
        setSimState({
          nivell: 0,
          errorIntegral: 0,
          qi: 0,
          qo: 0,
          tensioBomba: 0,
          temps: 0,
          windupActiu: false,
          errorActual: 0
        });
        setHistorial([]);
        setSerialLogs(["--- Preset aplicat ---", "Premeu PLAY per iniciar"]);
      };

      // Funció que executa un pas (1 dècima de segon / sample_time)
      const executarPasSimulacio = () => {
        setSimState((prev) => {
          const dt = sampleTime / 1000; // 0.1 segons

          // 1. CONTROLADOR PI AMB ANTI-WINDUP (MÈTODE DE CLAMPING CONDICIONAL)
          const error = setpoint - prev.nivell;
          
          // Calculem quina seria la sortida si s'apliqués la integral prèvia
          const pTerm = kp * error;
          const iTermPrevia = ki * prev.errorIntegral * dt;
          const uPrevia = pTerm + iTermPrevia;

          // Condicions de saturació del controlador físic (la bomba es clampa a 0 o al màxim teòric de 1500)
          const estaSaturatSota = uPrevia < 0;
          const estaSaturatDalt = uPrevia > 1500;

          // El windup s'activa si estem saturats i l'error continua empenyent cap a la saturació
          const windupSota = estaSaturatSota && error < 0;
          const windupDalt = estaSaturatDalt && error > 0;
          const sotaAW = windupSota || windupDalt;

          // Només s'activa el Windup de la integral si l'interruptor de control està HABILITAT
          const actiuAW = antiWindupHabilitat && sotaAW;

          // Acumulem la integral només si l'Anti-Windup NO està bloquejant el càlcul
          let nouErrorIntegral = prev.errorIntegral;
          if (!actiuAW) {
            nouErrorIntegral = prev.errorIntegral + error;
          }

          // Càlcul final de la llei de control amb la integral realment obtinguda
          const iTerm = ki * nouErrorIntegral * dt;
          const u = pTerm + iTerm;

          // Inèrcia de la bomba física: l'aigua d'entrada no canvia a l'instant
          const limitU = Math.max(0, u);
          const nouQi = prev.qi + (limitU - prev.qi) / bombaInercia;

          // 2. SIMULACIÓ FÍSICA
          // Cabal de sortida proporcional al nivell d'aigua
          const nouQo = kAixeta * prev.nivell;

          // Cabal net (+ disturbi opcional que simula pluja/fuita)
          const qNet = nouQi - nouQo + disturbi;
          
          // Variació de nivell = temps * q_net / àrea
          const variacioNivell = dt * qNet / areaBase;
          let nouNivell = prev.nivell + variacioNivell;
          
          // Restriccions físiques
          if (nouNivell > 30) nouNivell = 30;
          if (nouNivell < 0) nouNivell = 0;

          const nouTemps = prev.temps + 1;

          // Determinació d'estat d'alarmes per registrar en el sèrie
          let alarmStr = "";
          if (nouNivell >= alarmHigh) {
            alarmStr = "\t[ALERTA NIVELL ALT]";
          } else if (nouNivell <= alarmLow) {
            alarmStr = "\t[ALERTA NIVELL BAIX]";
          }
          if (actiuAW) {
            alarmStr += "\t[AW-BLOQUEJAT]";
          } else if (sotaAW && !antiWindupHabilitat) {
            alarmStr += "\t[WINDUP-CREIXENT!]";
          }

          // Guardem l'historial d'aquest pas
          const nouRegistre = {
            temps: (nouTemps * dt).toFixed(1),
            nivell: parseFloat(nouNivell.toFixed(2)),
            setpoint: setpoint,
            qi: parseFloat(nouQi.toFixed(1)),
            qo: parseFloat(nouQo.toFixed(1)),
            error: parseFloat(error.toFixed(2)),
            alarmHigh: alarmHigh,
            alarmLow: alarmLow
          };

          setHistorial((prevH) => {
            const h = [...prevH, nouRegistre];
            if (h.length > 100) h.shift();
            return h;
          });

          // Afegir log a la consola sèrie simulada
          setSerialLogs((prevL) => {
            const logStr = `${nouRegistre.temps}s\tNivell: ${nouRegistre.nivell.toFixed(2)} cm\tError: ${nouRegistre.error.toFixed(2)}\tQi: ${nouRegistre.qi.toFixed(1)} cm³/s\tQo: ${nouRegistre.qo.toFixed(1)} cm³/s${alarmStr}`;
            const logs = [...prevL, logStr];
            if (logs.length > 150) logs.shift();
            return logs;
          });

          return {
            nivell: nouNivell,
            errorIntegral: nouErrorIntegral,
            qi: nouQi,
            qo: nouQo,
            tensioBomba: u,
            temps: nouTemps,
            windupActiu: actiuAW,
            errorActual: error
          };
        });
      };

      // Control de reproducció automàtica
      useEffect(() => {
        if (isRunning) {
          simInterval.current = setInterval(() => {
            executarPasSimulacio();
          }, sampleTime);
        } else {
          if (simInterval.current) clearInterval(simInterval.current);
        }
        return () => {
          if (simInterval.current) clearInterval(simInterval.current);
        };
      }, [isRunning, kp, ki, setpoint, kAixeta, areaBase, disturbi, bombaInercia, sampleTime, alarmHigh, alarmLow, antiWindupHabilitat]);

      // Scroll intern suau de la consola
      useEffect(() => {
        if (terminalContainerRef.current) {
          const container = terminalContainerRef.current;
          container.scrollTop = container.scrollHeight;
        }
      }, [serialLogs]);

      const reiniciarSimulacio = () => {
        setIsRunning(false);
        setSimState({
          nivell: 0,
          errorIntegral: 0,
          qi: 0,
          qo: 0,
          tensioBomba: 0,
          temps: 0,
          windupActiu: false,
          errorActual: 0
        });
        setHistorial([]);
        setSerialLogs(["--- Simulador Inicialitzat ---", "Configureu paràmetres i premeu PLAY"]);
      };

      // Càlculs dinàmics de l'estat actual de la fórmula (visual)
      const actualError = (setpoint - nivell).toFixed(2);
      const actualPTerm = (kp * (setpoint - nivell)).toFixed(1);
      const actualITerm = (ki * errorIntegral * (sampleTime / 1000)).toFixed(1);
      const actualVariacio = ((sampleTime/1000) * (qi - qo + disturbi) / areaBase).toFixed(4);

      return (
        <div className="max-w-7xl mx-auto p-4">
          
          {/* HEADER PRINCIPAL */}
          <header className="mb-4 flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-3">
            <div>
              <span className="bg-blue-500/10 text-blue-400 text-xs font-semibold px-2.5 py-1 rounded-full border border-blue-500/20 uppercase tracking-wider">
                Institut de l'Ebre • Vicent Favà i Agustí Baubí (curs 2025-26) 
              </span>
              <h1 className="text-xl md:text-2xl font-black tracking-tight mt-1 bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
                Mòdul Mesura i Regulació. Tauler de Regulació de Nivell PI
              </h1>
            </div>
            
            {/* BOTONS GENERALS DE SIMULACIÓ */}
            <div className="mt-3 md:mt-0 flex gap-2">
              <button
                onClick={() => setIsRunning(!isRunning)}
                className={`px-4 py-1.5 rounded-lg text-xs font-bold flex items-center gap-2 transition-all shadow-md ${
                  isRunning 
                    ? 'bg-amber-600 hover:bg-amber-500 text-white shadow-amber-900/20' 
                    : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-emerald-900/20'
                }`}
              >
                {isRunning ? (
                  <>
                    <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    Pausa
                  </>
                ) : (
                  <>
                    <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    Iniciar (Play)
                  </>
                )}
              </button>
              <button
                onClick={() => { executarPasSimulacio(); setIsRunning(false); }}
                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold transition-colors border border-slate-700 text-slate-200"
                title="Avança només 100 ms"
              >
                Pas a Pas
              </button>
              <button
                onClick={reiniciarSimulacio}
                className="px-3 py-1.5 bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 rounded-lg text-xs font-semibold transition-colors border border-rose-500/20"
              >
                Reset
              </button>
            </div>
          </header>

          {/* DISSENY GENERAL EN COMPARTIMENTS */}
          <div className="space-y-4">
            
            {/* MÓDUL DE CONFIGURACIÓ RÀPIDA (PRESETS + SWITCH ANTI-WINDUP) */}
            <div className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60 shadow-md flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4">
              
              {/* Presets */}
              <div className="flex flex-col sm:flex-row items-start sm:items-center gap-3">
                <span className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                  <svg className="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                  Escenari:
                </span>
                <div className="flex flex-wrap gap-1.5">
                  {Object.keys(presets).map((key) => (
                    <button
                      key={key}
                      onClick={() => aplicarPreset(presets[key])}
                      className="px-2.5 py-1 text-xs bg-slate-900 hover:bg-slate-700 border border-slate-700 rounded-md transition-all font-semibold text-slate-300 hover:text-white"
                    >
                      {presets[key].name}
                    </button>
                  ))}
                </div>
              </div>

              {/* INTERRUPTOR DE SEGURETAT ANTI-WINDUP (Molt visible) */}
              <div className="flex items-center justify-between lg:justify-end gap-3 bg-slate-900/60 px-4 py-1.5 rounded-lg border border-slate-700/50">
                <div className="text-left">
                  <span className="text-xs font-bold text-slate-300 block">SISTEMA ANTI-WINDUP</span>
                  <span className="text-[10px] text-slate-400 block">Clamping en saturació</span>
                </div>
                <button
                  onClick={() => setAntiWindupHabilitat(!antiWindupHabilitat)}
                  className={`w-14 h-7 flex items-center rounded-full p-1 transition-all duration-300 ${
                    antiWindupHabilitat ? 'bg-emerald-600 justify-end' : 'bg-rose-900 justify-start'
                  }`}
                  title="Activa/Desactiva el bloqueig de la integral en saturació"
                >
                  <span className="bg-white w-5 h-5 rounded-full shadow-md transition-transform duration-300"></span>
                </button>
                <span className={`text-xs font-bold tracking-wider ${antiWindupHabilitat ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {antiWindupHabilitat ? 'ACTIU' : 'DESACTIVAT'}
                </span>
              </div>

            </div>

            {/* CONTINGUT PRINCIPAL EN DOS GRANS BLOCS (Planta i Control / Càlculs Matemàtics) */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
              
              {/* COLUMNA ESQUERRA: SLIDERS VERTICALS + DIPÒSIT D'AIGUA (Col: 7) */}
              <div className="lg:col-span-7 bg-slate-800/80 rounded-xl p-4 border border-slate-700/60 shadow-lg flex flex-col justify-between">
                <div className="border-b border-slate-700/60 pb-2 mb-4 flex justify-between items-center">
                  <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wider">
                    Estat de la Planta Física i Controladors Verticals
                  </h2>
                  <span className="text-[10px] text-slate-500 font-mono">SEGURETAT I CONTROL ACTIU</span>
                </div>

                {/* INTEGRACIÓ INTERACTIVA: SLIDERS VERTICALS AL COSTAT DEL DIPÒSIT */}
                <div className="grid grid-cols-12 gap-3 items-center">
                  
                  {/* SLIDERS VERTICALS */}
                  <div className="col-span-6 bg-slate-900/50 p-2 rounded-xl border border-slate-700/40 flex flex-row justify-around items-stretch h-[240px]">
                    
                    {/* Vertical Slider 1: Setpoint */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-blue-400">SP</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0"
                          max="30"
                          step="1"
                          value={setpoint}
                          onChange={(e) => setSetpoint(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-blue-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-blue-300 bg-blue-950/80 px-1 py-0.5 rounded font-bold">{setpoint}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Consigna</span>
                    </div>

                    {/* Vertical Slider 2: Kp */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-amber-400">Kp</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0"
                          max="500"
                          step="10"
                          value={kp}
                          onChange={(e) => setKp(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-amber-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-amber-300 bg-amber-950/80 px-1 py-0.5 rounded font-bold">{kp}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Proporc.</span>
                    </div>

                    {/* Vertical Slider 3: Ki */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-teal-400">Ki</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0"
                          max="200"
                          step="5"
                          value={ki}
                          onChange={(e) => setKi(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-teal-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-teal-300 bg-teal-950/80 px-1 py-0.5 rounded font-bold">{ki}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Integral</span>
                    </div>

                    {/* Vertical Slider 4: kAixeta */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-rose-400">Aix.</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0"
                          max="40"
                          step="1"
                          value={kAixeta}
                          onChange={(e) => setKAixeta(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-rose-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-rose-300 bg-rose-950/80 px-1 py-0.5 rounded font-bold">{kAixeta}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Sortida</span>
                    </div>

                    {/* Vertical Slider 5: Pertorbació */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-violet-400">Pert</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="-150"
                          max="150"
                          step="10"
                          value={disturbi}
                          onChange={(e) => setDisturbi(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-violet-500"
                        />
                      </div>
                      <span className={`text-[9px] font-mono px-0.5 py-0.5 rounded font-bold ${disturbi > 0 ? 'bg-indigo-950 text-indigo-300' : 'bg-slate-950 text-slate-400'}`}>{disturbi}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Pluja</span>
                    </div>

                    {/* Vertical Slider 6: Inèrcia Bomba */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-slate-400">Inè.</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="1"
                          max="50"
                          step="1"
                          value={bombaInercia}
                          onChange={(e) => setBombaInercia(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-slate-300"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-slate-300 bg-slate-850 px-1 py-0.5 rounded font-bold">{bombaInercia}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Inèrcia</span>
                    </div>

                    {/* Límits d'Alarmes */}
                    {/* Vertical Slider 7: Alarma Alta (alarmHigh) */}
                    <div className="flex flex-col items-center justify-between h-full group border-l border-red-500/15 pl-1">
                      <span className="text-[10px] font-bold text-red-500">AL.H</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="15"
                          max="30"
                          step="1"
                          value={alarmHigh}
                          onChange={(e) => setAlarmHigh(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-red-600"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-red-400 bg-red-950/80 px-1 py-0.5 rounded font-bold">{alarmHigh}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Alarma Alta</span>
                    </div>

                    {/* Vertical Slider 8: Alarma Baixa (alarmLow) */}
                    <div className="flex flex-col items-center justify-between h-full group">
                      <span className="text-[10px] font-bold text-amber-500">AL.L</span>
                      <div className="relative flex-grow my-1 flex justify-center">
                        <input
                          type="range"
                          orient="vertical"
                          min="0"
                          max="14"
                          step="1"
                          value={alarmLow}
                          onChange={(e) => setAlarmLow(parseInt(e.target.value))}
                          className="w-1.5 bg-slate-700 rounded-lg outline-none cursor-pointer accent-amber-500"
                        />
                      </div>
                      <span className="text-[9px] font-mono text-amber-400 bg-amber-950/80 px-1 py-0.5 rounded font-bold">{alarmLow}</span>
                      <span className="text-[8px] text-slate-500 uppercase mt-0.5 opacity-0 group-hover:opacity-100 transition-opacity">Alarma Baixa</span>
                    </div>

                  </div>

                  {/* EL DIPÒSIT SVG ANIMAT */}
                  <div className="col-span-6 flex flex-col items-center relative">
                    
                    {/* Indicadors ràpids flotants */}
                    <div className="absolute top-0 right-0 flex flex-col items-end gap-1 text-[10px] font-mono z-20">
                      <div className="bg-slate-900/95 px-1.5 py-0.5 rounded border border-slate-700/60 flex items-center gap-1.5">
                        <span className="w-2 h-2 bg-sky-500 rounded-full animate-pulse"></span>
                        <span>Entrada: <strong className="text-sky-400">{qi.toFixed(1)}</strong></span>
                      </div>
                      <div className="bg-slate-900/95 px-1.5 py-0.5 rounded border border-slate-700/60 flex items-center gap-1.5">
                        <span className="w-2 h-2 bg-rose-500 rounded-full"></span>
                        <span>Sortida: <strong className="text-rose-400">{qo.toFixed(1)}</strong></span>
                      </div>
                      <div className="bg-slate-900/95 px-1.5 py-0.5 rounded border border-slate-700/60 flex items-center gap-1.5">
                        <span>Nivell: <strong className="text-emerald-400">{nivell.toFixed(2)} cm</strong></span>
                      </div>
                    </div>

                    {/* SVG principal del Dipòsit */}
                    <div className="w-full max-w-[260px] h-[240px] mt-2">
                      <svg viewBox="0 0 200 240" className="w-full h-full">
                        
                        {/* INDICADORS LED D'ALARMES INDUSTRIALS */}
                        <g transform="translate(45, 15)">
                          <circle cx="0" cy="0" r="4.5" fill={nivell >= alarmHigh ? "#ef4444" : "#1e293b"} stroke={nivell >= alarmHigh ? "#fca5a5" : "#475569"} strokeWidth="1" className={nivell >= alarmHigh ? "animate-pulse" : ""} />
                          <text x="8" y="2.5" fill={nivell >= alarmHigh ? "#ef4444" : "#64748b"} fontSize="7" fontWeight="bold">ALM ALT</text>
                        </g>

                        <g transform="translate(110, 15)">
                          <circle cx="0" cy="0" r="4.5" fill={nivell <= alarmLow ? "#f59e0b" : "#1e293b"} stroke={nivell <= alarmLow ? "#fef08a" : "#475569"} strokeWidth="1" className={nivell <= alarmLow ? "animate-pulse" : ""} />
                          <text x="8" y="2.5" fill={nivell <= alarmLow ? "#f59e0b" : "#64748b"} fontSize="7" fontWeight="bold">ALM BAIX</text>
                        </g>

                        {/* Bomba motoritzada */}
                        <path d="M 10 32 L 70 32 L 70 47 L 60 47 L 60 40 L 10 40 Z" fill="#475569" />
                        <rect x="5" y="22" width="15" height="25" rx="2" fill="#1e293b" stroke="#64748b" strokeWidth="2" />
                        <text x="12" y="38" fontSize="8" fill="#38bdf8" textAnchor="middle" fontWeight="bold">M</text>

                        {/* Doll d'aigua d'entrada */}
                        {qi > 0.5 && (
                          <path 
                            d={`M 65 47 Q 65 ${80 + (30 - nivell) * 2} ${65 + Math.min(qi/10, 15)} ${220 - (nivell / 30 * 160)}`}
                            fill="none" 
                            stroke="#38bdf8" 
                            strokeWidth={Math.min(2 + qi/40, 7)} 
                            strokeDasharray="4 2"
                            className="animate-dash"
                            style={{ strokeDashoffset: -temps * 5 }}
                          />
                        )}

                        {/* Tub d'escapament de l'aixeta */}
                        <path d="M 170 210 L 200 210 L 200 220 L 170 220 Z" fill="#475569" />
                        <circle cx="185" cy="215" r="7" fill="#dc2626" />
                        <line x1="185" y1="205" x2="185" y2="225" stroke="#fca5a5" strokeWidth="2" />

                        {/* Doll de sortida de l'aixeta */}
                        {qo > 0.5 && kAixeta > 0 && (
                          <path 
                            d={`M 195 215 Q 220 220 225 240`} 
                            fill="none" 
                            stroke="#0284c7" 
                            strokeWidth={Math.min(1 + qo/40, 6)} 
                            strokeDasharray="3 2"
                            className="animate-dash"
                            style={{ strokeDashoffset: temps * 4 }}
                          />
                        )}

                        {/* Cos del Dipòsit */}
                        <rect x="40" y="50" width="130" height="170" fill="none" stroke="#94a3b8" strokeWidth="4" rx="2" />
                        <line x1="35" y1="60" x2="175" y2="60" stroke="#b91c1c" strokeWidth="1" strokeDasharray="2 2" opacity="0.6" />
                        
                        {/* Límits d'Alarme Dinàmics */}
                        {(() => {
                          const yAlarmHigh = 220 - (alarmHigh / 30 * 160);
                          return (
                            <g>
                              <line x1="38" y1={yAlarmHigh} x2="172" y2={yAlarmHigh} stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4 3" opacity="0.9" />
                              <text x="165" y={yAlarmHigh - 3} fill="#f87171" fontSize="7" textAnchor="end" fontWeight="bold">LIM NIVELL ALT: {alarmHigh}cm</text>
                            </g>
                          );
                        })()}

                        {(() => {
                          const yAlarmLow = 220 - (alarmLow / 30 * 160);
                          return (
                            <g>
                              <line x1="38" y1={yAlarmLow} x2="172" y2={yAlarmLow} stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="4 3" opacity="0.9" />
                              <text x="165" y={yAlarmLow + 8} fill="#fbbf24" fontSize="7" textAnchor="end" fontWeight="bold">LIM NIVELL BAIX: {alarmLow}cm</text>
                            </g>
                          );
                        })()}

                        {/* Setpoint */}
                        {(() => {
                          const ySetpoint = 220 - (setpoint / 30 * 160);
                          return (
                            <g>
                              <line x1="38" y1={ySetpoint} x2="172" y2={ySetpoint} stroke="#3b82f6" strokeWidth="2" strokeDasharray="5 3" />
                              <text x="45" y={ySetpoint - 4} fill="#60a5fa" fontSize="9" fontWeight="bold">Consigna: {setpoint}cm</text>
                            </g>
                          );
                        })()}

                        {/* Massa d'aigua */}
                        {nivell > 0 && (
                          <rect 
                            x="42" 
                            y={220 - (nivell / 30 * 160)} 
                            width="126" 
                            height={(nivell / 30 * 160)} 
                            fill="#38bdf8" 
                            fillOpacity="0.45" 
                            rx="1"
                          />
                        )}

                        {/* Regle de mesura */}
                        {[0, 10, 20, 30].map((val) => {
                          const yPos = 220 - (val / 30 * 160);
                          return (
                            <g key={val}>
                              <line x1="170" y1={yPos} x2="175" y2={yPos} stroke="#94a3b8" strokeWidth="1.5" />
                              <text x="181" y={yPos + 3} fill="#94a3b8" fontSize="8" fontFamily="monospace">{val}cm</text>
                            </g>
                          );
                        })}

                        {/* Indicador numèric */}
                        <g transform={`translate(100, ${220 - (nivell / 30 * 160) + 12})`}>
                          {nivell > 2 && (
                            <rect x="-30" y="-10" width="60" height="14" rx="3" fill="#0f172a" fillOpacity="0.8" />
                          )}
                          {nivell > 2 && (
                            <text x="0" y="0" fill="#38bdf8" fontSize="9" fontWeight="bold" textAnchor="middle" fontFamily="monospace">
                              {nivell.toFixed(1)} cm
                            </text>
                          )}
                        </g>

                      </svg>
                    </div>
                  </div>

                </div>
              </div>

              {/* COLUMNA DRETA: EL PANELL COMPLET DE CÀLCULS EN TEMPS REAL RESTAURAT (Col: 5) */}
              <div className="lg:col-span-5 bg-slate-800/80 rounded-xl p-4 border border-slate-700/60 shadow-lg flex flex-col justify-between">
                <div>
                  <div className="border-b border-slate-700/60 pb-2 mb-3 flex items-center gap-2">
                    <span className="w-2.5 h-2.5 bg-amber-500 rounded-full animate-pulse"></span>
                    <h2 className="text-sm font-bold text-slate-300 uppercase tracking-wider">
                      Càlculs Interns (Temps Real)
                    </h2>
                  </div>
                  
                  <div className="space-y-3 text-xs font-mono">
                    {/* Pas 1 */}
                    <div className="bg-slate-900/60 p-2.5 rounded border border-slate-755">
                      <span className="text-slate-400 font-bold text-[10px] block uppercase tracking-wide">1. Error (e) = Setpoint - Nivell</span>
                      <div className="text-blue-400 text-sm mt-1 font-bold">
                        {setpoint} - {nivell.toFixed(2)} = <span className="text-emerald-400">{actualError} cm</span>
                      </div>
                    </div>

                    {/* Pas 2 (Actualitzat amb la lògica de canvi del Windup dinàmic pas a pas) */}
                    <div className="bg-slate-900/60 p-2.5 rounded border border-slate-755">
                      <div className="flex justify-between items-center mb-1">
                        <span className="text-slate-400 font-bold text-[10px] block uppercase tracking-wide">2. Part Integral acumulant (error_integral)</span>
                        <span className={`text-[9px] px-1.5 py-0.5 rounded border font-sans font-bold ${
                          !antiWindupHabilitat 
                            ? 'bg-slate-800 text-slate-400 border-slate-700' 
                            : windupActiu 
                              ? 'bg-red-500/10 text-red-400 border-red-500/25 animate-pulse' 
                              : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/25'
                        }`}>
                          {!antiWindupHabilitat ? 'Anti-Windup: OFF' : windupActiu ? '⚠️ AW Actiu (Bloquejat)' : 'AW OK (Integrant)'}
                        </span>
                      </div>
                      
                      <div className="text-teal-400 text-xs font-bold mt-1.5 space-y-1">
                        <div>
                          Suma acumulada = <span className="text-teal-300">{errorIntegral.toFixed(1)}</span>
                        </div>
                        
                        {/* Fórmula dinàmica pas a pas molt visible */}
                        <div className="text-[11px] text-slate-300 font-normal border-t border-slate-700/40 pt-1 mt-1">
                          {windupActiu ? (
                            <span className="text-red-400">
                              Equació: {errorIntegral.toFixed(1)} + <span className="underline font-bold">0</span> (Anti-Windup Actiu!) = <span className="font-bold">{errorIntegral.toFixed(1)}</span>
                            </span>
                          ) : (
                            <span className="text-slate-200">
                              Equació: {errorIntegral.toFixed(1)} + ({actualError}) = <span className="font-bold">{(errorIntegral + parseFloat(actualError)).toFixed(1)}</span>
                            </span>
                          )}
                        </div>
                      </div>

                      {/* Caixa d'explicació de l'estat actual */}
                      <div className="text-[10px] text-slate-400 mt-2 font-sans italic leading-normal">
                        {windupActiu ? (
                          <span className="text-red-400 font-semibold block">
                            • Clamping condicional actiu: Com que la bomba s'ha saturat a 0 i l'error demana buidar encara més, s'ignora l'error d'aquest cicle per evitar que l'acumulador baixi indefinidament.
                          </span>
                        ) : !antiWindupHabilitat && (nivell > setpoint) && (qi <= 0.01) ? (
                          <span className="text-rose-400 font-semibold block">
                            • Alerta de saturació (Windup): L'Anti-Windup està desactivat. L'acumulador continua restant valor de forma il·limitada tot i que la bomba estigui parada. Això retardarà la reacció posterior!
                          </span>
                        ) : (
                          <span>
                            • Integració regular: El controlador està dins dels marges d'operació física de la bomba i l'error s'acumula amb normalitat.
                          </span>
                        )}
                      </div>
                    </div>

                    {/* Pas 3 */}
                    <div className="bg-slate-900/60 p-2.5 rounded border border-slate-755">
                      <span className="text-slate-400 font-bold text-[10px] block uppercase tracking-wide">3. Equació del Controlador (u)</span>
                      <div className="text-slate-200 text-[11px] mt-1.5 leading-relaxed whitespace-pre-line">
                        u = (Kp · e) + (Ki · e_integral · dt)
                        u = (<span className="text-amber-400">{kp}</span> · <span className="text-emerald-400">{actualError}</span>) + (<span className="text-teal-400">{ki}</span> · <span className="text-teal-300">{errorIntegral.toFixed(1)}</span> · 0.1)
                        u = <span className="text-amber-300">{actualPTerm}</span> + <span className="text-teal-300">{actualITerm}</span> = <span className="text-purple-400 font-bold text-sm">{tensioBomba.toFixed(1)}</span>
                      </div>
                    </div>

                    {/* Pas 4 */}
                    <div className="bg-slate-900/60 p-2.5 rounded border border-slate-755">
                      <span className="text-slate-400 font-bold text-[10px] block uppercase tracking-wide">4. Física del dipòsit (q_net / Area)</span>
                      <div className="text-slate-200 text-[11px] mt-1.5 leading-relaxed">
                        ΔNivell = dt · (qi - qo + pertorbació) / Àrea
                        ΔNivell = 0.1 · ({qi.toFixed(1)} - {qo.toFixed(1)} + {disturbi}) / {areaBase}
                        ΔNivell = <span className="text-amber-500 font-bold">{actualVariacio > 0 ? `+${actualVariacio}` : actualVariacio} cm/pas</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="mt-3 text-[10px] text-slate-400 bg-slate-900/35 p-2 rounded border border-slate-700/20">
                  <span className="font-bold text-amber-500">Mètode:</span> Cada dècima de segon, el bucle resol aquestes equacions recursives per ajustar la bomba en temps real.
                </div>
              </div>

            </div>

            {/* COMPARTIMENT INFERIOR: GRÀFIC DE RESPOSTA I TERMINAL */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              
              {/* Gràfic simplificat de nivell i Límits d'Alarma */}
              <div className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60 shadow-md flex flex-col h-[240px]">
                <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
                  Gràfic Temporal de Nivell i Llindars d'Alarma
                </h3>
                <div className="relative flex-grow bg-slate-950 rounded-lg p-2 border border-slate-700/70 overflow-hidden flex items-end">
                  
                  {/* Línia de graella de l'Alarma de Nivell Alt */}
                  <div 
                    className="absolute left-0 right-0 border-t border-red-500/45 border-dotted z-0 flex items-center pl-2"
                    style={{ bottom: `${(alarmHigh / 30) * 100}%` }}
                  >
                    <span className="text-[8px] text-red-400 font-bold bg-slate-950 px-1 rounded -mt-2">
                      Alarma Alta: {alarmHigh} cm
                    </span>
                  </div>

                  {/* Línia de graella del Setpoint */}
                  <div 
                    className="absolute left-0 right-0 border-t border-blue-500/50 border-dashed z-0 flex items-center pl-2"
                    style={{ bottom: `${(setpoint / 30) * 100}%` }}
                  >
                    <span className="text-[9px] text-blue-400 font-bold bg-slate-950 px-1 rounded -mt-2.5">
                      Ref: {setpoint} cm
                    </span>
                  </div>

                  {/* Línia de graella de l'Alarma de Nivell Baix */}
                  <div 
                    className="absolute left-0 right-0 border-t border-amber-500/40 border-dotted z-0 flex items-center pl-2"
                    style={{ bottom: `${(alarmLow / 30) * 100}%` }}
                  >
                    <span className="text-[8px] text-amber-400 font-bold bg-slate-950 px-1 rounded -mt-2">
                      Alarma Baixa: {alarmLow} cm
                    </span>
                  </div>

                  {/* Línies d'historial */}
                  <div className="w-full h-full flex items-end justify-between gap-[1px] relative z-10">
                    {historial.map((pt, idx) => {
                      const hPercent = (pt.nivell / 30) * 100;
                      const setPointPercent = (pt.setpoint / 30) * 100;
                      
                      // Color dinàmic de la barra del gràfic si està en alarma
                      let barColor = "bg-sky-500/70 hover:bg-sky-400";
                      if (pt.nivell >= pt.alarmHigh) {
                        barColor = "bg-red-600/85 hover:bg-red-500";
                      } else if (pt.nivell <= pt.alarmLow) {
                        barColor = "bg-amber-500/85 hover:bg-amber-400";
                      }

                      return (
                        <div key={idx} className="flex-grow h-full relative group">
                          <div 
                            className={`absolute bottom-0 left-0 right-0 rounded-t-sm transition-all ${barColor}`}
                            style={{ height: `${hPercent}%` }}
                          ></div>
                          <div 
                            className="absolute w-1 h-1 bg-blue-400 rounded-full left-1/2 -translate-x-1/2 -translate-y-1/2"
                            style={{ bottom: `${setPointPercent}%` }}
                          ></div>

                          <div className="absolute bottom-full left-1/2 -translate-x-1/2 bg-slate-900 text-slate-200 text-[10px] px-2 py-1 rounded border border-slate-700 opacity-0 group-hover:opacity-100 transition-opacity z-50 pointer-events-none whitespace-nowrap mb-1">
                            T: {pt.temps}s • {pt.nivell}cm <br />
                            SP: {pt.setpoint}cm <br />
                            {pt.nivell >= pt.alarmHigh && "⚠️ ALTA"}
                            {pt.nivell <= pt.alarmLow && "⚠️ BAIXA"}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {historial.length === 0 && (
                    <div className="absolute inset-0 flex items-center justify-center text-slate-500 text-xs text-center p-4">
                      Els gràfics es dibuixen en iniciar la simulació.
                    </div>
                  )}
                </div>
                
                <div className="flex justify-between items-center text-[9px] text-slate-400 mt-2">
                  <span className="flex items-center gap-1">
                    <span className="w-2 h-2 bg-sky-500 rounded-full inline-block"></span> Estàndard
                  </span>
                  <span className="flex items-center gap-1">
                    <span className="w-2 h-2 bg-red-500 rounded-full inline-block"></span> Alarma Alta
                  </span>
                  <span className="flex items-center gap-1">
                    <span className="w-2 h-2 bg-amber-500 rounded-full inline-block"></span> Alarma Baixa
                  </span>
                  <span>Visualització real de 10s</span>
                </div>
              </div>

              {/* Consola Terminal */}
              <div className="bg-slate-800/80 rounded-xl p-3 border border-slate-700/60 shadow-md flex flex-col h-[240px]">
                <div className="flex justify-between items-center border-b border-slate-700/80 pb-2 mb-2">
                  <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-1.5">
                    <span className="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
                    Consola Monitor Sèrie (9600 bps)
                  </h3>
                  <button 
                    onClick={() => setSerialLogs(["--- Consola Netejada ---"])}
                    className="text-[10px] text-slate-400 hover:text-slate-200 bg-slate-900 px-2 py-0.5 rounded border border-slate-700"
                  >
                    Esborrar
                  </button>
                </div>

                <div 
                  ref={terminalContainerRef}
                  className="flex-grow bg-slate-950 rounded-lg p-2.5 font-mono text-emerald-400 overflow-y-auto space-y-1 border border-slate-900 h-0"
                >
                  {serialLogs.map((log, i) => (
                    <div key={i} className="whitespace-pre-wrap leading-tight text-[11px] opacity-90 border-b border-slate-900/30 pb-0.5">
                      {log}
                    </div>
                  ))}
                </div>
              </div>

            </div>

          </div>

        </div>
      );
    }

    // Renderitzem l'aplicació dins del root principal de la web
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
