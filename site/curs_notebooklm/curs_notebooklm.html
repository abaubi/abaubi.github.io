<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impulsant els projectes d’innovació amb NotebookLM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --corp-blue: rgb(29, 113, 184);
            --corp-bg: #f8fafc;
        }
        body {
            font-family: 'Nunito', sans-serif;
            color: var(--corp-blue);
            background-color: var(--corp-bg);
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .text-corporate { color: var(--corp-blue); }
        .bg-corporate { background-color: var(--corp-blue); }
        .border-corporate { border-color: var(--corp-blue); }
        
        /* Animacions */
        .slide-enter { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-container img {
            max-height: 55px;
            width: auto;
            object-fit: contain;
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Capçalera Institucional amb LOGOS ACTUALITZATS -->
    <header class="flex justify-between items-center px-8 py-3 border-b-2 border-corporate bg-white shrink-0 shadow-sm">
        <!-- Logo Esquerra: Institut de l'Ebre -->
        <div class="logo-container">
            <img src="../../img/Nou_logo_Institut_Ebre_NEGRE_NEGRE (1).jpg" alt="Logo Institut de l'Ebre">
        </div>
        
        <!-- Logo Centre: InnovaFP -->
        <div class="logo-container">
            <img src="../../img/Innovafp.png" alt="Logo InnovaFP">
        </div>
        
        <!-- Logo Dreta: Creem Oportunitats -->
        <div class="logo-container">
            <img src="../../img/Creem Oportunitats_COLOR (1).jpg" alt="Logo Creem Oportunitats">
        </div>
    </header>

    <!-- Contenidor Principal -->
    <main class="flex-grow relative flex items-center justify-center p-8 md:p-16 overflow-hidden">
        <div id="slide-content" class="w-full max-w-5xl slide-enter">
            <!-- El contingut s'injectarà dinàmicament aquí -->
        </div>
    </main>

    <!-- Controls de Navegació -->
    <footer class="flex justify-between items-center px-8 py-4 bg-white border-t border-corporate/20 shrink-0">
        <button id="btn-prev" onclick="canviarDiapositiva(-1)" class="bg-corporate hover:bg-blue-800 text-white font-bold py-2 px-6 rounded-lg shadow transition duration-200 disabled:opacity-30">
            &larr; Anterior
        </button>
        <div id="slide-counter" class="font-bold text-lg tracking-widest text-corporate bg-blue-50 px-4 py-1 rounded-full border border-corporate/30">
            1 / 10
        </div>
        <button id="btn-next" onclick="canviarDiapositiva(1)" class="bg-corporate hover:bg-blue-800 text-white font-bold py-2 px-6 rounded-lg shadow transition duration-200 disabled:opacity-30">
            Següent &rarr;
        </button>
    </footer>

    <script>
        const dadesPresentacio = [
            {
                id: 0,
                titol: "Impulsant els projectes d’innovació amb NotebookLM",
                subtitol: "Eines de productivitat i rigor acadèmic per al professorat d'FP",
                punts: []
            },
            {
                id: 1,
                titol: "Més enllà d'aprendre: Principals Funcions de NotebookLM",
                subtitol: "NotebookLM és un \"game changer\" que permet anar més enllà de la simple pregunta:",
                punts: [
                    "<strong>Sintetitzar i Organitzar:</strong> Resumir milers de pàgines i organitzar la informació en menys temps.",
                    "<strong>Generar recursos docents:</strong> Crear glossaris tècnics, guies d'estudi i preguntes freqüents (FAQ).",
                    "<strong>Multimodalitat:</strong> Crear mapes mentals, infografies i presentacions per facilitar l'aprenentatge visual.",
                    "<strong>Recerca Multilingüe:</strong> Investigar en més de 50 idiomes i obtenir resultats en català."
                ]
            },
            {
                id: 2,
                titol: "Rigor en els resultats sense al·lucinacions",
                subtitol: "La fi de les dades inventades per la IA",
                punts: [
                    "<strong>El problema:</strong> Les IAs generalistes poden inventar dades (\"al·lucinar\") en buscar a tot el web.",
                    "<strong>La solució:</strong> NotebookLM crea un \"entorn de coneixement tancat\" basat en les teves fonts.",
                    "<strong>Rigor acadèmic:</strong> Ets el responsable de pujar manuals fidedignes; l'IA no se'n pot sortir."
                ]
            },
            {
                id: 3,
                titol: "Alimentant el sistema amb fonts",
                subtitol: "Fins a 50 fonts per quadern digital:",
                punts: [
                    "<strong>Documents tècnics:</strong> PDFs i manuals del sector professional.",
                    "<strong>Vídeos de YouTube:</strong> L'IA analitza la transcripció per extreure conceptes clau.",
                    "<strong>Enllaços Web:</strong> Articles especialitzats o competència directa.",
                    "<strong>Àudios i Notes:</strong> Arxius de text i àudios de reunions o idees.",
                    "<strong>Recerca avançada:</strong> Buscar fonts directament des de la interfície."
                ]
            },
            {
                id: 4,
                titol: "Flux de Treball amb NotebookLM",
                subtitol: "Mitjançant un sistema de tres passos:",
                punts: [
                    "<strong>1. Càrrega de fonts:</strong> Organitzar la documentació al panell esquerre.",
                    "<strong>2. Consulta interactiva:</strong> Fer preguntes com si parlessis amb un expert.",
                    "<strong>3. Genera materials:</strong> Pots crear des de mapes metals fins a videos explicatius."
                ]
            },
            {
                id: 5,
                titol: "Prompts. L'Art de demanar",
                subtitol: "Mètode de 5 passos per obtenir resultats útils:",
                punts: [
                    "<strong>Rol:</strong> \"Actua com un mentor de projectes d'innovació\".",
                    "<strong>Objectiu:</strong> \"Crea una llista de potencials projectes d'innovació del mòdul de digitalització\".",
                    "<strong>Audiència:</strong> \"Per a alumnat de Grau Superior\".",
                    "<strong>Restriccions:</strong> \"Evita projectes irreals; sigues pràctic i aplicat al sector industrial\".",
                    "<strong>Format:</strong> \"Redacta una taula de 10 projectes i les seves seccions principals seguint la metodologia Design thinking\"."
                ]
            },
            {
                id: 6,
                titol: "Productivitat amb NotebookLM",
                subtitol: "Eines disruptives per a l'eficiència docent:",
                punts: [
                    "<strong>Automatització:</strong> Generar glossaris, infografies i presentacions en segons.",
                    "<strong>Audio Overview:</strong> Transformar documentació en un pòdcast de debat entre dues veus.",
                    "<strong>Mapes Mentals:</strong> Visualització instantània de l'estructura del coneixement."
                ]
            },
            {
                id: 7,
                titol: "Suport en Projectes d'Innovació",
                subtitol: "Un consultor permanent per a l'alumnat:",
                punts: [
                    "<strong>Recerca en Projectes:</strong> Sintetitzar memòries i documentació tècnica complexa.",
                    "<strong>Rigor en la Memòria:</strong> Validar qualsevol afirmació amb cites directes del document.",
                    "<strong>Desenvolupament de Reptes:</strong> Detecció i anàlisi de problemes reals del sector."
                ]
            },
            {
                id: 8,
                titol: "La velocitat de la innovació al centre",
                subtitol: "Augmentant l'impacte del projectes d'innovació i els seus resultats.",
                punts: [
                    "<strong>Augmentar la Velocitat:</strong> Reduir barreres de temps en recerca i redacció de projectes d'innovació.",
                    "<strong>Eficiència:</strong> Facilitar la creació d'embrions de projectes d'innovació a partir de reptes detectats.",
                    "<strong>Sistematització:</strong> Eines per millorar les prestacions dels projectes d'innovació."
                ]
            },
            {
                id: 9,
                titol: "Pràctica Individual (Learning by doing)",
                subtitol: "Taller: experiència aplicada de 60 minuts",
                punts: [
                    "<strong>00-15':</strong> Demostració inicial",
                    "<strong>15-35':</strong> Creació del quadern digital, càrrega de fonts del propi mòdul professional i interacció amb el xat.",
                    "<strong>35-50':</strong> Prova de prompts i generació de l'Audio Overview.",
                    "<strong>50-60':</strong> Dubtes i debat sobre la transferència als projectes d'innovació."
                ]
            }
        ];

        let slideActual = 0;
        const totalSlides = dadesPresentacio.length;
        const contentContainer = document.getElementById('slide-content');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const counter = document.getElementById('slide-counter');

        function renderitzarDiapositiva() {
            contentContainer.classList.remove('slide-enter');
            void contentContainer.offsetWidth;
            contentContainer.classList.add('slide-enter');

            const dades = dadesPresentacio[slideActual];
            let htmlHTML = '';

            if (dades.id === 0) {
                htmlHTML = `
                    <div class="text-center flex flex-col items-center justify-center h-full space-y-8">
                        <div class="bg-corporate text-white p-4 rounded-full w-24 h-24 flex items-center justify-center mb-6 shadow-xl">
                            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        </div>
                        <h1 class="text-5xl md:text-6xl font-extrabold leading-tight tracking-tight">${dades.titol}</h1>
                        <div class="h-1 w-32 bg-corporate rounded-full opacity-50"></div>
                        <h2 class="text-2xl md:text-3xl font-light text-blue-800/80">${dades.subtitol}</h2>
                    </div>
                `;
            } else {
                let llistaPunts = dades.punts.map(punt => 
                    `<li class="flex items-start gap-4 text-xl md:text-2xl leading-relaxed">
                        <span class="text-corporate shrink-0 mt-1">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                        </span>
                        <span>${punt}</span>
                    </li>`
                ).join('');

                htmlHTML = `
                    <div class="space-y-8 w-full">
                        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight border-b-4 border-blue-200 pb-4">${dades.titol}</h1>
                        <h3 class="text-2xl font-semibold text-blue-800/80 mb-6">${dades.subtitol}</h3>
                        <ul class="space-y-6 mt-8 pl-4">
                            ${llistaPunts}
                        </ul>
                    </div>
                `;
            }

            contentContainer.innerHTML = htmlHTML;
            counter.textContent = `${slideActual + 1} / ${totalSlides}`;
            btnPrev.disabled = slideActual === 0;
            btnNext.disabled = slideActual === totalSlides - 1;
        }

        function canviarDiapositiva(direccio) {
            const nouIndex = slideActual + direccio;
            if (nouIndex >= 0 && nouIndex < totalSlides) {
                slideActual = nouIndex;
                renderitzarDiapositiva();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') canviarDiapositiva(1);
            if (e.key === 'ArrowLeft') canviarDiapositiva(-1);
        });

        renderitzarDiapositiva();
    </script>
</body>
</html>
